<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net ; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
:root {
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --radius-s: 4px;
  --radius: 8px;
  --radius-l: 12px;
  color-scheme: light;
  --background: #ffffff;
  --panel: #ffffff;
  --shadow: 0 1px 2px rgb(20 24 31 / 0.08), 0 6px 20px rgb(20 24 31 / 0.09);
  --surface: #eceef1;
  --surface-2: #dcdfe4;
  --ink: #1e1f22;
  --ink-2: #4b4e54;
  --action: #1e1f22;
  --on-action: #ffffff;
  --focus: #0a63a0;
  --edge: #6a6f78;
  --edge-dim: #c3c7cd;
  --edge-highlight: #1e1f22;
  --node-dim: #bdbdbd;
  --plate: #e6e9ee;
  --plate-2: #d6dae1;
  --t-1: #8f6a00;
  --t-2: #0072b2;
  --t-3: #0a7f5f;
  --t-4: #c2531b;
  --t-5: #a33f7c;
  --t-6: #5e5aa8;
  --r-low: #0072b2;
  --r-medium: #8f6a00;
  --r-high: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --background: #15171b;
    --panel: #1d2026;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.5), 0 8px 24px rgb(0 0 0 / 0.4);
    --surface: #292d34;
    --surface-2: #363b44;
    --ink: #ecedf0;
    --ink-2: #c3c7cd;
    --action: #ecedf0;
    --on-action: #15171b;
    --focus: #6ab7ee;
    --edge: #9a9ea8;
    --edge-dim: #444850;
    --edge-highlight: #ecedf0;
    --node-dim: #50545c;
    --plate: #272b33;
    --plate-2: #323741;
    --t-1: #e0b83a;
    --t-2: #5bb3f0;
    --t-3: #3dc9a0;
    --t-4: #f08a5a;
    --t-5: #e58bbe;
    --t-6: #a9a3ee;
    --r-low: #5bb3f0;
    --r-medium: #e0b83a;
    --r-high: #ff7b6b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: #15171b;
  --panel: #1d2026;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.5), 0 8px 24px rgb(0 0 0 / 0.4);
  --surface: #292d34;
  --surface-2: #363b44;
  --ink: #ecedf0;
  --ink-2: #c3c7cd;
  --action: #ecedf0;
  --on-action: #15171b;
  --focus: #6ab7ee;
  --edge: #9a9ea8;
  --edge-dim: #444850;
  --edge-highlight: #ecedf0;
  --node-dim: #50545c;
  --plate: #272b33;
  --plate-2: #323741;
  --t-1: #e0b83a;
  --t-2: #5bb3f0;
  --t-3: #3dc9a0;
  --t-4: #f08a5a;
  --t-5: #e58bbe;
  --t-6: #a9a3ee;
  --r-low: #5bb3f0;
  --r-medium: #e0b83a;
  --r-high: #ff7b6b;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--background);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 1rem;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; text-align: left; }
a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: var(--radius-s); }
code.nb { white-space: nowrap; }
code {
  font-family: var(--mono);
  font-size: 0.875em;
  background: var(--surface);
  padding: 0.1em 0.35em;
  border-radius: var(--radius-s);
  overflow-wrap: anywhere;
}
h1 { font-size: 1.75rem; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; overflow-wrap: anywhere; }
h2 { font-size: 1.25rem; line-height: 1.25; font-weight: 700; }
h3 { font-size: 1rem; line-height: 1.3; font-weight: 700; }
.text { max-width: 62ch; overflow-wrap: anywhere; }
.text + .text { margin-top: 0.75rem; }

/* ---- page grid: text on the left, sticky views on the right ---- */
.page {
  display: grid;
  grid-template-columns: minmax(0, 34rem) minmax(0, 1fr);
  column-gap: 3rem;
  align-items: start;
  padding: 1.5rem 2rem 2rem;
  max-width: 100rem;
}
.text-column { min-width: 0; padding-bottom: 3rem; }
.header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }

/* ---- Simple / Technical control: neutral tone, inverted when active ---- */
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface); border-radius: var(--radius-l); }
.seg button { min-height: 40px; padding: 0 1rem; border-radius: var(--radius); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--action); color: var(--on-action); }

/* ---- buttons: one dominant action, the others tonal; none outlined ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  min-height: 44px; padding: 0 1.1rem; border-radius: var(--radius);
  background: var(--surface); color: var(--ink); font-weight: 600;
}
.btn[aria-pressed="true"], .btn-primary { background: var(--action); color: var(--on-action); }
.btn-subtle { min-height: 40px; padding: 0 0.9rem; }
@media (prefers-reduced-motion: no-preference) {
  .btn, .seg button, .node, .tab { transition: background-color 120ms, color 120ms; }
}
@media (hover: hover) {
  .btn:not([aria-pressed="true"]):not(.btn-primary):hover { background: var(--surface-2); }
  .seg button[aria-pressed="false"]:hover { background: var(--surface-2); }
  .tab[aria-selected="false"]:hover { background: var(--surface-2); }
  .node:not([aria-pressed="true"]):hover { background: var(--surface); }
}

/* ---- paths and addresses: wrap only after "/", never within a name ---- */
.path { font-family: var(--mono); font-size: 0.8125rem; line-height: 1.45; }
.sg { white-space: nowrap; }
.refs { color: var(--ink-2); }

/* ---- node row: the whole row is the button; step highlighting uses bold and a left marker ---- */
.node {
  position: relative; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 0.7rem;
  width: 100%; padding: 0.4rem 0.75rem; border-radius: var(--radius); min-height: 36px;
}
.node .path, .node .label { order: 1; flex: 1 1 auto; min-width: 0; }
.node .label { font-size: 0.9375rem; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
.node .citation-refs { order: 3; flex: 1 0 100%; font-family: var(--mono); font-size: 0.8125rem; line-height: 1.45; color: var(--ink-2); overflow-wrap: anywhere; }
.node .risk-tag { order: 2; flex: none; margin-left: auto; font-size: 0.875rem; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.node[data-highlighted] .path { font-weight: 700; }
.node[data-highlighted]::before { content: ""; position: absolute; left: 0; top: 0.3rem; bottom: 0.3rem; width: 3px; border-radius: 2px; background: var(--ink); }
.node[aria-pressed="true"] { background: var(--action); color: var(--on-action); }
.node[aria-pressed="true"] .refs, .node[aria-pressed="true"] .citation-refs, .node[aria-pressed="true"] .risk-tag { color: var(--on-action); }
.node[aria-pressed="true"] .path { font-weight: 700; }
.node[aria-pressed="true"]::before { display: none; }
.node-list { display: grid; gap: 2px; }
@media (pointer: coarse) { .node { min-height: 44px; } }

/* ---- node index and glossary: collapsed after the introduction ---- */
.index { margin-top: 1rem; }
.index + .index { margin-top: 0.25rem; }
.index summary { list-style: none; display: flex; align-items: center; column-gap: 0.6rem; min-height: 44px; padding: 0 0.75rem; border-radius: var(--radius); font-weight: 700; cursor: pointer; }
.index summary::-webkit-details-marker { display: none; }
.index summary::before { content: ""; width: 0.45rem; height: 0.45rem; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); margin-right: 0.15rem; }
.index[open] summary::before { transform: rotate(45deg); }
.index[open] summary { margin-bottom: 0.25rem; }
@media (hover: hover) { .index summary:hover { background: var(--surface); } }
.glossary { display: grid; gap: 0.9rem; padding: 0.25rem 0.75rem 0.5rem; }
.glossary dt { font-weight: 700; }
.glossary dd { max-width: 62ch; overflow-wrap: anywhere; }

/* ---- key concepts (profile A): neutral blocks, without a border ---- */
.concepts { display: grid; gap: 0.75rem; margin-top: 1.25rem; }
.concept { padding: 0.9rem 1.1rem 1rem; background: var(--surface); border-radius: var(--radius-l); }
.concept .caption { font-size: 0.9375rem; font-weight: 600; color: var(--ink-2); }
.concept .term { font-size: 1.0625rem; font-weight: 700; line-height: 1.3; }
.concept .text { margin-top: 0.35rem; }

/* ---- document: one step at a time ---- */
.document > h2 { margin-top: 1.75rem; font-size: 1.0625rem; overflow-wrap: anywhere; }
.step { margin-top: 1.75rem; }
.step-header { display: block; width: 100%; padding: 0.4rem 0; border-radius: var(--radius); }
.step-header .n { display: flex; justify-content: space-between; column-gap: 1rem; font-size: 0.875rem; font-weight: 700; color: var(--ink-2); }
.step-header .n .d-on { display: none; }
.step-header .t { display: block; font-size: 1.1875rem; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.step-header[aria-pressed="true"] { background: var(--action); color: var(--on-action); padding: 0.55rem 0.75rem; margin-inline: -0.75rem; width: calc(100% + 1.5rem); }
.step-header[aria-pressed="true"] .n { color: var(--on-action); }
.step-header[aria-pressed="true"] .n .d-on { display: inline; }
.step-header[aria-pressed="true"] .n .d-off { display: none; }
@media (hover: hover) { .step-header[aria-pressed="false"]:hover .t { text-decoration: underline; text-underline-offset: 3px; } }
.step .text { margin-top: 0.6rem; }
.step .touches { margin: 1rem 0 0.35rem; font-weight: 700; font-size: 0.9375rem; }
.step .node-block { margin: 1rem 0 0.25rem; }
#content > .node-block, #node-block > .node-block { margin-top: 0.5rem; }
.citation-list { display: grid; gap: 0.2rem; padding: 0 0.75rem; }
.footer { margin-top: 2.25rem; font-size: 0.875rem; color: var(--ink-2); max-width: 62ch; overflow-wrap: anywhere; }
.sources { margin-top: 2.25rem; }
.sources h2 { font-size: 1.0625rem; }
.sources ul { display: grid; gap: 0.9rem; margin-top: 0.6rem; }
.sources li { display: grid; gap: 0.1rem; max-width: 62ch; }
.sources .source-title { font-weight: 600; overflow-wrap: anywhere; }
.sources .refs { font-size: 0.875rem; }

/* ---- node block: raised block ---- */
.node-block {
  scroll-margin-top: 1rem; padding: 1.1rem 1.25rem 1.4rem;
  background: var(--panel); border-radius: var(--radius-l); box-shadow: var(--shadow);
}
.node-block:focus, .node-block:focus-visible { outline: none; }
.node-block .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 0.25rem 0.75rem; font-size: 0.875rem; color: var(--ink-2); margin-bottom: 0.25rem; }
.node-block .meta .meta-risk { font-weight: 700; color: var(--ink); }
.node-block .meta .btn { margin-left: auto; color: var(--ink); font-size: 1rem; }
.node-block .meta .btn-primary { order: -1; margin-left: 0; margin-right: auto; color: var(--on-action); }
.node-block .node-title { font-size: 1.0625rem; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
.node-block .node-title.path-heading { font-family: var(--mono); }
.node-block .text { margin-top: 0.75rem; }
.node-block section { margin-top: 1.5rem; }
.node-block section > h3 { margin-bottom: 0.4rem; }
.node-files { display: grid; gap: 0.2rem; }
.edge-item { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 0.75rem; }
.edge-item .node { flex: 1 1 0; min-width: 0; width: auto; padding-right: 0; }
.edge-item .verb { flex: none; max-width: 45%; font-size: 0.9375rem; font-weight: 600; text-align: right; overflow-wrap: anywhere; }
.edge-item .ref { flex: 1 0 100%; font-family: var(--mono); font-size: 0.8125rem; color: var(--ink-2); padding: 0 0.75rem 0.4rem 0.75rem; overflow-wrap: anywhere; }
.node-steps { display: grid; gap: 2px; }
.node-steps button { display: block; width: 100%; padding: 0.45rem 0.75rem; min-height: 40px; border-radius: var(--radius); }
.node-steps button[aria-pressed="true"] { background: var(--action); color: var(--on-action); }
@media (hover: hover) { .node-steps button[aria-pressed="false"]:hover { background: var(--surface); } }

/* ---- view column: tabs above the panel, the page's only raised block besides the open node ---- */
.view-column {
  position: sticky; top: 1.5rem; height: calc(100vh - 3rem); min-height: 28rem;
  display: flex; flex-direction: column; gap: 0.6rem; min-width: 0;
}
.tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 3px; align-self: flex-start; max-width: 100%; background: var(--surface); border-radius: var(--radius-l); }
.tab { min-height: 40px; padding: 0 1rem; border-radius: var(--radius); font-weight: 600; overflow-wrap: anywhere; }
.tab[aria-selected="true"] { background: var(--action); color: var(--on-action); }
/* On touch, tabs and panel buttons are 44 px like nodes (after their base rules, which have equal specificity). */
@media (pointer: coarse) { .tab, .seg button, .btn-subtle { min-height: 44px; } }
.view-panel {
  flex: 1 1 auto; min-height: 0; min-width: 0;
  display: flex; flex-direction: column; gap: 0.6rem;
  padding: 1rem 1.1rem 1.1rem; background: var(--panel); border-radius: var(--radius-l); box-shadow: var(--shadow);
}
.panel-header { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
.panel-header h2 { font-size: 1.0625rem; overflow-wrap: anywhere; }
.panel-actions { display: flex; gap: 0.4rem; margin-left: auto; }
.bodies { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.view-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 0.6rem; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 1.1rem; font-size: 0.875rem; color: var(--ink); }
.legend li { display: inline-flex; align-items: center; gap: 0.4rem; }
.legend .dot { width: 0.75rem; height: 0.75rem; border-radius: 50%; background: var(--color); }
.legend .dot.p1 { width: 0.5rem; height: 0.5rem; }
.legend .dot.p3 { width: 1rem; height: 1rem; }
.legend .dash { width: 1.5rem; border-top: 2px dashed currentColor; }
.arrows { font-size: 0.875rem; color: var(--ink-2); max-width: 62ch; }
.screen-area { position: relative; flex: 1 1 auto; min-height: 20rem; }
.screen { position: absolute; inset: 0; overflow: hidden; }
.screen canvas { display: block; width: 100%; height: 100%; }
.label-layer { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
/* The library briefly shows an English hint (10px) before showNavInfo(false) takes effect. */
.screen .scene-nav-info { display: none !important; }
.view-state { position: absolute; inset: 0; display: grid; place-items: center; color: var(--ink-2); font-size: 0.9375rem; }
.btn-touch { position: absolute; right: 0.5rem; bottom: 0.5rem; z-index: 3; }
.node-label { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 2; }
.node-label span, .label-3d span {
  display: block; white-space: nowrap;
  font-size: 0.8125rem; line-height: 1.2; padding: 2px 6px; border-radius: var(--radius-s);
  color: var(--ink);
  text-shadow: 0 0 2px var(--panel), 0 0 2px var(--panel), 0 0 4px var(--panel), 0 0 4px var(--panel);
}
.label-3d span { white-space: normal; max-width: 9rem; text-align: center; overflow-wrap: anywhere; }
.label-3d[data-long] span { max-width: 13rem; }
.label-3d[data-narrow] span { max-width: 5.5rem; }
.label-3d[data-medium] span { max-width: 8rem; }
.label-3d[data-left] span { text-align: left; }
.node-label[data-highlighted] span, .label-3d[data-highlighted] span, .label-3d[data-strong] span { font-weight: 700; }
.node-label[data-selected] span, .label-3d[data-selected] span { background: var(--action); color: var(--on-action); font-weight: 700; text-shadow: none; }
.no-view { padding: 0.5rem 0 1rem; max-width: 68ch; }
.no-view .notice { font-weight: 700; font-size: 1.0625rem; }
.no-view .text { margin-top: 0.25rem; }
.no-view ul, .no-view ol { display: grid; gap: 0.3rem; margin-top: 0.75rem; }
.no-view ol { padding-left: 1.4rem; list-style: decimal; }
.no-view li { font-size: 0.9375rem; line-height: 1.45; }
.no-view li .path { font-size: 0.8125rem; }
.no-view .text-label { font-weight: 600; }
/* In text mode, the column fits its contents and scrolls internally if taller than the screen. */
.view-column[data-text] { height: auto; min-height: 0; max-height: calc(100vh - 3rem); }
.view-column[data-text] .view-panel { overflow: auto; }
.view-column[data-text] .bodies, .view-column[data-text] .view-body { flex: none; }

@media (max-width: 56rem) {
  .page { display: block; padding: 1.25rem 1rem 2rem; }
  .text-column { padding-bottom: 0; }
  h1 { font-size: 1.5rem; }
  .view-column, .view-column[data-text] { position: static; height: auto; min-height: 0; max-height: none; margin-top: 2.5rem; }
  .view-column[data-text] .view-panel { overflow: visible; }
  .view-panel { flex: none; }
  .bodies, .view-body { flex: none; }
  .screen-area { flex: none; height: 26rem; min-height: 0; }
  .node-block { padding: 1rem 1rem 1.25rem; }
}
</style>
</head>
<body>
<div class="page">
  <main class="text-column" id="text-column">
    <div class="header">
      <h1 id="title"></h1>
      <div class="seg" role="group" aria-label="Text level">
        <button type="button" data-level="simple" aria-pressed="true">Simple</button>
        <button type="button" data-level="technical" aria-pressed="false">Technical</button>
      </div>
    </div>
    <div id="intro"></div>
    <section class="concepts" id="concepts" aria-label="Key concepts" hidden></section>
    <details class="index" id="index-details">
      <summary id="index-summary"></summary>
      <ul class="node-list" id="index"></ul>
    </details>
    <details class="index" id="glossary-details" hidden>
      <summary id="glossary-summary"></summary>
      <dl class="glossary" id="glossary"></dl>
    </details>
    <div id="content">
      <section class="document" id="document" aria-labelledby="h-doc" tabindex="-1"></section>
      <div id="node-block" hidden></div>
    </div>
    <p class="footer" id="footer"></p>
  </main>
  <aside class="view-column" id="view-column" aria-label="Views">
    <div class="tabs" id="tabs" role="tablist" aria-label="Views" hidden></div>
    <section class="view-panel" id="view-panel">
      <div class="panel-header">
        <h2 id="panel-title"></h2>
        <div class="panel-actions">
          <button type="button" class="btn btn-subtle" id="b-flat" aria-pressed="false">Flat</button>
          <button type="button" class="btn btn-subtle" id="b-frame">Frame</button>
        </div>
      </div>
      <div class="bodies" id="bodies"></div>
    </section>
  </aside>
</div>
<script type="application/json" id="data">{}</script>
<script id="scene-code"></script>
<script>
(function () {
'use strict';
/* All data text enters the page through textContent or createElement; no innerHTML with data. */
const data = JSON.parse(document.getElementById('data').textContent);
if (!Array.isArray(data.nodes) || !Array.isArray(data.steps) || !Array.isArray(data.views)) {
  document.getElementById('title').textContent = 'Template without data';
  document.getElementById('intro').textContent = 'This file is the template. Generate the page with generate-page.mjs from the explanation data.';
  return;
}

/* The only external libraries, loaded only when a view uses them: the graph (3d-force-graph) only for graph views; three and its two addons for all other views, including scenes.
   The graph is a single file with a checksum (SRI): the browser rejects it if jsDelivr serves different contents. The three modules have no integrity: jsDelivr's +esm files are generated by the service and their hash is not guaranteed. */
const URLS = {
  graph: 'https://cdn.jsdelivr.net/npm/3d-force-graph@1.80.1/dist/3d-force-graph.min.js',
  graphSri: 'sha384-i98VDQKdpyVrtyuFn0fjUWJBLBmxnqHqOANcvYe9HLJUgT2wPixa4ZkLd7Dh3VEk',
  three: 'https://cdn.jsdelivr.net/npm/three@0.186.1/+esm',
  orbit: 'https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/controls/OrbitControls.js/+esm',
  css2d: 'https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/renderers/CSS2DRenderer.js/+esm',
};

/* ---------- data and state ---------- */
const params = new URLSearchParams(location.search);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const profile = data.profile;
const gran = data.granularity;
const concepts = Array.isArray(data.concepts) ? data.concepts : [];
const sources = Array.isArray(data.sources) ? data.sources : [];
const byId = new Map(data.nodes.map((n) => [n.id, n]));

const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function themeColors() {
  const series = [1, 2, 3, 4].map((i) => css('--t-' + i));

    background: css('--panel'), ink: css('--ink'), muted: css('--ink-2'), line: css('--edge'), highlight: css('--edge-highlight'), neutral: css('--node-dim'),

const nodeColor = (n) => (profile === 'C' && n.risk ? css('--r-' + n.risk) : css('--t-' + typeIndex.get(n.type)));
const RISK_SCALE = { low: 0.75, medium: 1, high: 1.4 };

/* ---------- three.js view frame: loop, pause, controls, highlighting, clicking and Frame ---------- */

  let framesRendered = 0, interacted = false, hovered = null, low = null, tween = null, destroyed = false;
  let flatActive = view.flat;
  let moved = false;
  const elements = new Map(); // id -> { objs: [Object3D] }
  const labels = [];          // { obj, el, id, fixed }
  const edges = [];          // { mat, active(focus) }
  const animations = [];
  const extras = [];           // points Frame must also keep visible (label margins)
  let user = {};            // what the scene returned (onHighlight)
  let drawing = { dir3D: V3(0.3, 0.25, 1), flatDirection: V3(0, 0, 1), defaultMode: 'highlight' };

  /* -- loop with pause: render only on interaction or page action -- */
  function draw() {
    render.render(scene, camera);

  function wake() {
    last = performance.now();
    if (!active || destroyed) return;

  function checkIdle() {

  function stop() {

  function loop(t) {

    lastFrame = t;
    if (tween) { tweenStep(t); last = performance.now(); }
    if (!reducedMotion.matches) {

      for (let i = animations.length - 1; i >= 0; i--) {
        try { animations[i](dt); } catch (e) { animations.splice(i, 1); }
      }
    }
    controls.update();
    draw();
    rafId = requestAnimationFrame(loop);
  }

  /* -- camera: Frame using registered bounds, Flat mode, and movement between positions -- */
  function box() {
    const b = new THREE.Box3();
    elements.forEach((el) => el.objs.forEach((o) => b.expandByObject(o)));
    extras.forEach((p) => b.expandByPoint(p));
    if (b.isEmpty()) b.set(V3(-1, -1, -1), V3(1, 1, 1));
    return b;
  }
  function destination(right) {
    const b = box();
    const center = b.getCenter(new THREE.Vector3());
    const f = right.clone().normalize();
    const up = V3(0, 1, 0);
    const dir_ = new THREE.Vector3().crossVectors(up, f);
    if (dir_.lengthSq() < 1e-8) dir_.set(1, 0, 0);
    dir_.normalize();
    const u = new THREE.Vector3().crossVectors(f, dir_).normalize();
    const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const tanH = tanV * Math.max(camera.aspect, 0.2);
    let D = 0;
    for (const x of [b.min.x, b.max.x]) for (const y of [b.min.y, b.max.y]) for (const z of [b.min.z, b.max.z]) {
      const rel = V3(x, y, z).sub(center);
      D = Math.max(D, Math.abs(rel.dot(dir_)) / tanH + rel.dot(f), Math.abs(rel.dot(u)) / tanV + rel.dot(f));
    }
    D = Math.max(D * 1.04, 4);
    // Agent-scene labels sit beside elements, outside Frame's measured box: move the camera back until they fit (about 70 px per side).
    if (view.type === 'scene' && labels.length) {
      const cam2 = camera.clone();
      const mx = (2 * 70) / Math.max(screen.clientWidth, 1), my = (2 * 24) / Math.max(screen.clientHeight, 1);

  }
  function moveTo(pos, target, ms) {
    if (!ms || reducedMotion.matches) {
      tween = null;
      camera.position.copy(pos);
      controls.target.copy(target);
      camera.lookAt(target);
      controls.update();
      wake();
      return;
    }
    tween = { t0: performance.now(), ms, p0: camera.position.clone(), a0: controls.target.clone(), p1: pos.clone(), a1: target.clone() };

  function tweenStep(t) {

    const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.a0, tween.a1, e);

  }
  function currentDirection() {
    const d = camera.position.clone().sub(controls.target);
    return d.lengthSq() < 1e-6 ? drawing.dir3D.clone() : d;
  }
  function frame(ms, right) {

    controls.minDistance = target.D * 0.15;
    controls.maxDistance = target.D * 6;
    camera.near = Math.max(target.D / 200, 0.05);
    camera.far = target.D * 40;

  function adjustFlatControls() {

    adjustFlatControls();

  }

  /* -- registering elements, labels and animations (also used by scenes) -- */
  const materialOwner = new Map();
  function element(id, obj) {
    if (!view.ids.includes(id)) throw new Error(`element «${id}» does not belong to this view`);
    if (!obj || !obj.isObject3D) throw new Error(`element «${id}» must be a three.js object`);
    if (!obj.parent) scene.add(obj);
    obj.traverse((o) => {
      const ms = Array.isArray(o.material) ? o.material : o.material ? [o.material] : [];
      ms.forEach((mt, i) => {
        const owner = materialOwner.get(mt);
        if (owner && owner !== id) { // a material shared by two elements would recolor both: give each its own
          const c = mt.clone();
          if (Array.isArray(o.material)) o.material[i] = c; else o.material = c;
          materialOwner.set(c, id);
        } else materialOwner.set(mt, id);
      });

  }
  const SPACING = { up: 'Bottom', low: 'Top', right: 'Left', left: 'Right' };
  const CENTER = { up: [0.5, 1], low: [0.5, 0], right: [0, 0.5], left: [1, 0.5] };

    // World units within "px" pixels when the view ("width" units, excluding padding) fills the screen: padding for a wide label at the edge.

    get height() { return screen.clientHeight || 420; },

    elements.forEach((el, id) => el.objs.forEach((o) => {
      const hit = ray.intersectObject(o, true);
      if (hit.length && hit[0].distance < d) { d = hit[0].distance; best = id; }
    }));
    if (best || !tolerance) return best;
    let dpx = tolerance;
    elements.forEach((el, id) => el.objs.forEach((o) => {
      const c = new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3()).project(camera);
      if (c.z > 1) return;
      const dist = Math.hypot((c.x * 0.5 + 0.5) * r.width + r.left - ev.clientX, (-c.y * 0.5 + 0.5) * r.height + r.top - ev.clientY);
      if (dist < dpx) { dpx = dist; best = id; }
    }));
    return best;
  }
  canvas.addEventListener('pointerdown', (e) => { low = { x: e.clientX, y: e.clientY, t: performance.now() }; wake(); });
  canvas.addEventListener('pointerup', (e) => {
    if (!low) return;
    const mov = Math.hypot(e.clientX - low.x, e.clientY - low.y), dur = performance.now() - low.t;

    if (mov > 8 || dur > 700) return;

  canvas.addEventListener('pointermove', (e) => {
    wake();
    if (e.pointerType !== 'mouse' || e.buttons) return;
    const id = pick(e, 0);
    if (id !== hovered) { hovered = id; canvas.style.cursor = id ? 'pointer' : ''; updateLabels(); }
  });
  canvas.addEventListener('pointerleave', () => { if (hovered) { hovered = null; canvas.style.cursor = ''; updateLabels(); } });
  canvas.addEventListener('wheel', wake, { passive: true });
  canvas.addEventListener('touchstart', wake, { passive: true });
  controls.addEventListener('start', () => { interacted = true; });
  controls.addEventListener('change', () => { moved = true; wake(); });

  /* -- touch scrolling: with controls off, the view does not capture it -- */
  function enableControls(on) {
    controls.enabled = on;
    const t = on ? 'none' : 'auto';
    canvas.style.touchAction = t;
    screen.style.touchAction = t;
  }

  /* -- size -- */
  function measure() {
    const w = screen.clientWidth, hh = screen.clientHeight;
    if (!w || !hh) return false;
    render.setSize(w, hh, false);
    labelRenderer.setSize(w, hh);
    camera.aspect = w / hh;
    camera.updateProjectionMatrix();
    return true;
  }
  // Determine narrow/wide format using the builders' width (m.width, falling back to 640 when hidden): the builder and observer compare the same measurement.
  const narrow = () => m.width < 520;
  let narrowAtBuild = false;
  const observer = new ResizeObserver(() => {
    if (!measure()) return;
    // Crossed the wide/narrow boundary (for example, phone rotation or the screen just gained a size): catalog views use a different layout.
    if (api.onResize && narrow() !== narrowAtBuild) { api.onResize(); return; }
    if (!interacted) frame(0, flatActive ? drawing.flatDirection : undefined);
    wake();
  });

  /* -- startup: build, check and frame -- */
  const api = {
    canvas, render, camera, controls, scene, elements, m,
    framesRendered: () => framesRendered,
    moved: () => moved,
    update, wake, enableControls,
    frame: (ms) => { interacted = false; frame(ms, flatActive ? drawing.flatDirection : undefined); },

    show() { active = true; measure(); wake(); },
    hide() { active = false; stop(); },

    init() {
      colors = themeColors();
      render.setClearColor(new THREE.Color(colors.background));
      camera.position.copy(drawing.dir3D.clone().multiplyScalar(40));
      controls.target.set(0, 0, 0);
      const initial = camera.position.clone();
      narrowAtBuild = narrow();
      const r = builder(m, def, colors, api);
      user = r && typeof r === 'object' ? r : {};
      if (!camera.position.equals(initial)) drawing.dir3D = camera.position.clone().sub(controls.target); // the scene chose a viewpoint: keep its direction
      adjustFlatControls();

      frame(0, flatActive ? drawing.flatDirection : drawing.dir3D);
      observer.observe(screen);
    },
    // The frame gives scenes the specified context. It does not isolate them: scenes run with the page's powers (see references/scene.md).
    context() {
      colors = themeColors();
      return {
        THREE, scene, camera, colors,
        element: (id, obj) => element(id, obj),
        label: (t, pos) => label(t, pos, { fixed: true }),
        animate,
        reducedMotion: reducedMotion.matches,
        touch: touch.matches,
      };
    },
    // After running the scene: every node in the view must be registered.
    check() {
      const missing = view.ids.filter((id) => !elements.has(id));

/* ---------- catalog views, drawn through the frame ---------- */
const builders = {
  layers(m, v) {
    const { V3, THREE } = m;
    const STEP = 4.6, DEPTH = 3.2;
    const maxN = Math.max(...v.layers.map((c) => c.nodes.length));
    const isNarrow = m.width < 520;
    // The layer name area is measured in pixels (about 120): narrow screens need more world units.
    const ZONE = isNarrow ? Math.min(11, (120 * (maxN * STEP + 2)) / Math.max(m.width - 120, 120)) : 6.6;
    const width = ZONE + maxN * STEP + 0.8;
    const DY = 6.2 * m.stretch(width + 1.2, (v.layers.length - 1) * 6.2 + 8);
    const pos = new Map();
    v.layers.forEach((c, k) => {
      const y = -k * DY;
      const plate = new THREE.Mesh(new THREE.BoxGeometry(width, 0.3, DEPTH), m.mat(css(k % 2 ? '--plate-2' : '--plate')));
      plate.position.set(0, y - 0.15, 0);
      m.add(plate);
      m.label(c.name, V3(-width / 2 + 0.5, y + 0.9, 0), { fixed: true, anchor: 'right', strong: true, narrow: true });
      c.nodes.forEach((id, j) => {
        const n = byId.get(id), e = m.scale(n);
        const x = -width / 2 + ZONE + (j + 0.5) * STEP;
        const hx = 1.4 * e, hy = 0.75 * e;
        const block = new THREE.Mesh(new THREE.BoxGeometry(2 * hx, 2 * hy, 1.1), m.mat(m.nodeColor(n)));
        block.position.set(x, y + hy, 0);
        m.element(id, block);
        const below = (c.nodes.length >= 3 || (isNarrow && c.nodes.length >= 2)) && j % 2 === 1; // with 3 or more in a row (2 on narrow screens), alternate names above and below to avoid overlap
        m.label(n.short, below ? V3(x, y - 0.35, 0) : V3(x, y + 2 * hy + 0.2, 0), { id, fixed: false, anchor: below ? 'low' : 'up', medium: true });
        pos.set(id, { x, y: y + hy, hx, hy });
      });
    });
    (v.edges || []).forEach((l) => {
      const a = pos.get(l.from), b = pos.get(l.to);
      if (!a || !b) return;
      const u = V3(b.x - a.x, b.y - a.y, 0).normalize();
      const output = (p) => Math.min(p.hx / Math.max(Math.abs(u.x), 1e-6), p.hy / Math.max(Math.abs(u.y), 1e-6)) + 0.12;
      const p0 = V3(a.x, a.y, 0.75).addScaledVector(u, output(a));
      const p1 = V3(b.x, b.y, 0.75).addScaledVector(u, -output(b));

      m.edge(material, (f) => activeEdge(f, l.from, l.to));

    [-1, 1].forEach((s) => { m.extend(V3(s * (width / 2 + 0.6), 5.4, 0)); m.extend(V3(s * (width / 2 + 0.6), background, 0)); });

  sequence(m, v) {

      m.add(g);
      const active = (f) => activeEdge(f, t.from, t.to);
      m.edge(material, active);
      m.label(t.event, point, { fixed: false, anchor: 'up', padding: 0.1, long: true, secondary: true, active });
    });
    m.extend(V3(-R - 5, 0, -R - 4)); m.extend(V3(R + 5, 1.5, R + 4));

  },

  'timeline'(m, v) {

        const n = byId.get(ev.node), e = m.scale(n), y = y0 - i * SY;

        const mark = new THREE.Mesh(new THREE.SphereGeometry(0.55 * e, 20, 14), m.mat(m.nodeColor(n)));

        g.add(mark);
        m.element(ev.node, g);
        m.label(ev.when, V3(-0.9 * e, y, 0), { id: ev.node, fixed: true, anchor: 'left', strong: true, medium: true });
        m.label(n.short, V3(0.9 * e, y, 0), { id: ev.node, fixed: false, anchor: 'right', medium: true });

    }

    const x0 = -((E.length - 1) / 2) * SX;
    m.add(m.cylinder(V3(x0 - 3, 0, 0), V3(-x0 + 3, 0, 0), 0.09, m.mat(m.colors.line)));
    E.forEach((ev, i) => {
      const n = byId.get(ev.node), e = m.scale(n), x = x0 + i * SX;
      const high = i % 2 ? 3.0 : 1.7;
      const g = new THREE.Group();
      const mark = new THREE.Mesh(new THREE.SphereGeometry(0.55 * e, 20, 14), m.mat(m.nodeColor(n)));
      mark.position.set(x, 0, 0);
      g.add(mark,
        m.cylinder(V3(x, 0.5 * e, 0), V3(x, high - 0.3, 0), 0.05, m.mat(m.colors.line)),
        m.cylinder(V3(x, -0.5 * e, 0), V3(x, -high + 0.3, 0), 0.05, m.mat(m.colors.line)));
      m.element(ev.node, g);
      m.label(ev.when, V3(x, high, 0), { id: ev.node, fixed: true, anchor: 'up', strong: true });
      m.label(n.short, V3(x, -high, 0), { id: ev.node, fixed: false, anchor: 'low' });
    });
    const side = 3 + m.padding(50, -2 * x0 + 6, 12);
    [-1, 1].forEach((s) => { m.extend(V3(s * (-x0 + side), 5, 0)); m.extend(V3(s * (-x0 + side), -5, 0)); });
    m.configure({ dir3D: V3(0.15, 0.12, 1), flatDirection: V3(0, 0, 1), defaultMode: 'natural' });
  },

  // The agent's scene: the frame calls it only now, after three loads, and checks its registrations.
  scene(m, v, colors, api) {
    try {
      if (typeof window.explainScene !== 'function') throw new Error('the page has no scene code');
      const f = window.explainScene; // called without this: the scene does not receive the window
      const r = f(api.context());
      api.check();
      return r;
    } catch (e) {
      const er = new Error(String(e && e.message ? e.message : e).slice(0, 240));
      er.fromScene = true;
      throw er;
    }
  },
};

/* ---------- graph view, using the 3d-force-graph library ---------- */
function createGraph(view, screen) {
  const def = view.def;
  const idsV = view.ids;
  let G = null;
  let nodes = [];
  let links = [];
  let labels = new Map();
  let values = new Map();
  let visible = new Set();
  let hoverId = null;
  let interacted = false;
  let awake = true;        // the library and label loops are running
  let loopActive = false;
  let engineStopped = false;    // the force simulation has settled
  let lastInteraction = -Infinity;
  let lastCamera = 0;
  let timer = 0;
  let ticks = 0;
  let active = false;
  let destroyed = false;
  let focus = { activeIds: null, node: null, neighborhood: false };
  let low = null;
  const api = { onSelect: null };
  const idOf = (x) => (typeof x === 'object' ? x.id : x);
  const riskBase = { low: 5, medium: 9, high: 15 };

  function load() {
    nodes = idsV.map((id) => ({ id, short: byId.get(id).short }));
    links = (def.edges || []).map((l) => ({ source: l.from, target: l.to, mode: l.mode }));
    engineStopped = false;
    G.graphData({ nodes: nodes, links: links });
    labels.forEach((el) => el.remove());
    labels = new Map();
    nodes.forEach((n) => {
      const el = h('div', { class: 'node-label', 'aria-hidden': 'true', hidden: true }, h('span', null, withoutCode(n.short)));
      screen.appendChild(el);
      labels.set(n.id, el);
    });
  }

  function init() {
    G = new ForceGraph3D(screen, { controlType: 'orbit', rendererConfig: { antialias: true, powerPreference: 'high-performance' } });
    G.renderer().setPixelRatio(pixelRatio());
    api.G = G;
    screen.__graph = G; // browser checks read the renderer here
    G.width(screen.clientWidth || 320).height(screen.clientHeight || 320)
      .showNavInfo(false)
      .numDimensions(view.flat ? 2 : 3)
      .nodeRelSize(4).nodeResolution(touch.matches ? 10 : 16).nodeOpacity(1)
      .nodeLabel(() => '') // use the page's labels; the library's HTML tooltip is unused
      .linkOpacity(0.85).linkResolution(touch.matches ? 4 : 6)
      .linkDirectionalArrowLength(5).linkDirectionalArrowRelPos(1)
      .enableNodeDrag(false)
      .warmupTicks(80).cooldownTicks(150).cooldownTime(4000)

    G.controls().addEventListener('change', () => { lastCamera = performance.now(); });

    const dist = Math.hypot(n.x - cam.position.x, n.y - cam.position.y, z - cam.position.z) || 1;
    const r = (Math.cbrt(values.get(n.id) || 5) * 4 * (hh / 2)) / (0.4663 * dist);
    return { x: p.x, y: p.y, r, inFront, inside: inFront && p.x > -30 && p.x < w + 30 && p.y > -30 && p.y < hh + 30 };
  }
  function pickNode(ev, tolerance) {
    const cam = G.camera();
    cam.updateMatrixWorld();
    const target = G.controls().target, r = screen.getBoundingClientRect();
    let best = null, d = Infinity;
    nodes.forEach((n) => {
      if (typeof n.x !== 'number') return;
      const i = nodeInfo(n, cam, target, r.width, r.height);
      if (!i.inFront) return;
      const dist = Math.hypot(i.x + r.left - ev.clientX, i.y + r.top - ev.clientY);
      if (dist <= Math.max(i.r + 4, tolerance) && dist < d) { d = dist; best = n.id; }
    });
    return best;
  }
  function positionLabels() {
    const cam = G.camera();
    cam.updateMatrixWorld();
    const target = G.controls().target;
    const w = screen.clientWidth, hh = screen.clientHeight;
    const infos = [];
    nodes.forEach((n) => {
      const el = labels.get(n.id);
      if (!el) return;
      if (typeof n.x !== 'number') { el.hidden = true; return; }
      const i = nodeInfo(n, cam, target, w, hh);
      infos.push({ n, el, x: i.x, y: i.y, r: i.r, show: i.inside && (visible.has(n.id) || n.id === hoverId || n.id === focus.node) });
    });
    const discs = infos.filter((i) => i.x > -30 && i.x < w + 30 && i.y > -30 && i.y < hh + 30).map((i) => ({ x: i.x, y: i.y, r: i.r, id: i.n.id }));
    const boxes = [];
    const priority = (i) => (i.n.id === focus.node ? 3 : i.n.id === hoverId ? 2 : 1);
    infos.filter((i) => i.show).sort((a, b) => priority(b) - priority(a)).forEach((i) => {
      if (i.el.hidden) i.el.hidden = false;
      const { w: lw, h: lh } = dimensionsOf(i.el, i.n.id);
      const g = 6;
      const cands = [
        { x: i.x - lw / 2, y: i.y + i.r + g },
        { x: i.x - lw / 2, y: i.y - i.r - g - lh },
        { x: i.x + i.r + g, y: i.y - lh / 2 },
        { x: i.x - i.r - g - lw, y: i.y - lh / 2 },
      ].map((c) => ({ ...c, w: lw, h: lh }));
      const fits = (c) => c.x >= 0 && c.y >= 0 && c.x + c.w <= w && c.y + c.h <= hh;
      const free = (c) => fits(c) && !boxes.some((b) => overlap(c, b)) && !discs.some((d) => d.id !== i.n.id && discOverlaps(d, c));
      const esc = cands.find(free) || cands.find((c) => fits(c) && !boxes.some((b) => overlap(c, b))) || cands.find(fits) || cands[0];
      boxes.push(esc);
      const t = `translate(${Math.round(esc.x)}px, ${Math.round(esc.y)}px)`;
      if (i.el.style.transform !== t) i.el.style.transform = t;

  }
  // Labels follow rendering: they stop and resume with it.
  function loop() {
    if (!G || !awake || destroyed) { loopActive = false; return; }
    positionLabels();
    requestAnimationFrame(loop);
  }

  init();
  Object.assign(api, {
    update, wake, frame: (ms) => { interacted = false; frame(null, ms); }, setFlat, enableControls,
    show() { active = true; G.width(screen.clientWidth || 320).height(screen.clientHeight || 320); wake(); },
    hide() { active = false; if (G) { if (timer) { clearTimeout(timer); timer = 0; } G.pauseAnimation(); awake = false; } },
    destroy() { destroyed = true; active = false; if (timer) clearTimeout(timer); if (G) { G.pauseAnimation(); if (G._destructor) G._destructor(); } },
  });
  return api;
}

/* ---------- each view's text version: no WebGL, missing library or failed scene ---------- */
function viewText(view, notice) {
  const v = view.def;
  const modeText = (md) => (profile === 'C' && md ? ', ' + MODE_WORD[md] : '');
  const names = (ids) => ids.map((id, j) => [j ? ', ' : '', nameElement(id)]);
  const edges = () => h('ul', null, (v.edges || []).map((l) => h('li', null,
    nameElement(l.from), ' ', h('strong', null, l.type + modeText(l.mode)), ' ', nameElement(l.to))));
  let intro, body;
  if (v.type === 'layers') {
    intro = 'Layers, top to bottom, and the edges between their elements:';
    body = [h('ol', null, v.layers.map((c) => h('li', null, h('strong', null, c.name + ': '), names(c.nodes)))), edges()];
  } else if (v.type === 'sequence') {
    intro = 'Messages, in the order they happen:';
    body = h('ol', null, v.messages.map((mg) => h('li', null, nameElement(mg.from), ' → ', nameElement(mg.to), ': ', mg.text + modeText(mg.mode))));
  } else if (v.type === 'states') {
    intro = 'Transitions between states, with the initial state first:';
    body = [h('p', { class: 'text' }, h('strong', null, 'Initial: '), nameElement(v.initial)),
      h('ul', null, v.transitions.map((t) => h('li', null, nameElement(t.from), ' → ', nameElement(t.to), ': ', t.event)))];
  } else if (v.type === 'timeline') {
    intro = 'Events, in order:';
    body = h('ol', null, v.events.map((e) => h('li', null, h('strong', null, e.when + ': '), nameElement(e.node))));
  } else if (v.type === 'scene') {
    intro = 'The elements of this view:';
    body = h('ul', null, v.nodes.map((id) => h('li', null, nameElement(id))));
  } else {
    intro = `The text and the ${NODE_LIST.toLowerCase()} list contain the same information. Edges, as text:`;
    const connected = new Set((v.edges || []).flatMap((l) => [l.from, l.to]));
    const unconnected = view.ids.filter((id) => !connected.has(id));
    body = [edges(), unconnected.length ? h('p', { class: 'text' }, 'No edges: ', names(unconnected)) : null];
  }
  return h('div', { class: 'no-view' }, h('p', { class: 'notice' }, notice), h('p', { class: 'text' }, intro), body);
}

/* ---------- panel: tabs, one view at a time, touch ---------- */
const HINT = {
  graph: 'Each arrow points from the actor to what it acts on.',
  layers: 'Each arrow points from the actor to what it acts on.',
  sequence: 'Messages run top to bottom, in the order they happen.',
  states: 'Each arrow is a transition, labeled with its trigger.',
  'timeline': 'Events run from oldest to newest, in the order they happened.',
};
function hintText(v) {
  const base = HINT[v.type] || '';
  if (!base || profile !== 'C' || !hasAsync(v.def)) return base;
  const motion = v.type === 'graph' && !reducedMotion.matches && !touch.matches;
  return `${base} Asynchronous edges are dashed${motion ? ' and have particles' : ''}; the list always identifies each kind.`;
}
function renderPanel() {
  const tabs = $('#tabs'), bodies = $('#bodies');
  const multiple = views.length > 1;
  tabs.hidden = !multiple;
  $('#panel-title').hidden = multiple;
  const panel = $('#view-panel');
  if (multiple) panel.setAttribute('role', 'tabpanel');
  views.forEach((v) => {
    if (multiple) tabs.appendChild(h('button', { type: 'button', role: 'tab', class: 'tab', id: 'tab-' + v.i, 'aria-selected': 'false', 'aria-controls': 'view-panel', tabindex: '-1', 'data-view': v.i }, v.def.title));
    v.screen = h('div', { class: 'screen', role: 'img', 'aria-label': `${v.def.title}: view with ${v.ids.length} elements; the document contains the same information as text` });
    v.button = h('button', { type: 'button', class: 'btn btn-touch', 'data-touch': v.i, hidden: true }, 'Rotate and zoom');
    v.hint = h('p', { class: 'arrows' }, hintText(v));
    v.body = h('div', { class: 'view-body', 'data-view': v.i, hidden: true },
      v.type === 'scene' ? null : legendElement(v), v.hint.textContent ? v.hint : null,
      h('div', { class: 'screen-area' }, v.screen, v.button));
    bodies.appendChild(v.body);
  });
}
function selectFromView(id) { openNode(id, { origin: 'outside' }); }
function applyTouch(v) {
  if (!v.ctl) { v.button.hidden = true; return; }
  v.ctl.enableControls(!touch.matches || v.rotate);
  v.button.textContent = v.rotate ? 'Done' : 'Rotate and zoom';
  v.button.hidden = !touch.matches || v !== views[state.view];
}
function updatePanel() {
  const v = views[state.view];
  const textMode = v.loadStatus === 'text';
  $('#view-column').toggleAttribute('data-text', textMode);
  $('#panel-title').textContent = v.def.title;
  $('#b-flat').setAttribute('aria-pressed', String(v.flat));
  $$('.panel-actions button').forEach((b) => { b.hidden = !v.ctl; });
  views.forEach(applyTouch);
  const panel = $('#view-panel');
  if (views.length > 1) panel.setAttribute('aria-labelledby', 'tab-' + v.i);
  else panel.setAttribute('aria-labelledby', 'panel-title');
}
function showText(v, notice) {
  v.loadStatus = 'text';
  v.body.setAttribute('data-text', '');
  $('.screen-area', v.body).hidden = true;
  $$('.legend, .arrows', v.body).forEach((e) => { e.hidden = true; });
  v.body.appendChild(viewText(v, notice));
}
const NOTICE_3D = 'The 3D views could not open in this browser.';
async function initView(v) {
  v.loadStatus = 'opening';
  v.body.setAttribute('aria-busy', 'true');
  v.screen.replaceChildren(h('p', { class: 'view-state' }, 'Opening the view…'));
  try {
    if (noWebgl) throw new Error(NOTICE_3D);
    if (v.type === 'graph') {
      await loadGraph();
      v.screen.replaceChildren();
      v.ctl = createGraph(v, v.screen);
    } else {
      const L = await loadThree();
      // three may arrive after a tab switch: a hidden screen measures 0 and would use the fallback width. Defer building until the tab opens (activateView returns here).
      if (v.body.hidden) { v.loadStatus = 'new'; v.promise = null; return; }
      v.screen.replaceChildren();
      v.ctl = createFrame(v, v.screen, L, builders[v.type] || builders.scene);
      v.ctl.init();
    }
    v.ctl.onSelect = selectFromView;
    if (v.ctl.m) v.ctl.m.onSelect = selectFromView;
    v.ctl.onResize = () => rebuild(v);
    v.loadStatus = 'open';
  } catch (e) {
    if (v.ctl) { try { v.ctl.destroy(); } catch (e2) { /* already broken */ } v.ctl = null; }
    v.screen.replaceChildren();
    showText(v, e && e.fromScene ? `The scene did not render: ${e.message}` : NOTICE_3D);
  } finally {
    v.body.removeAttribute('aria-busy');
  }
}
async function activateView(i) {
  const v = views[i];
  const before = views[state.view];
  if (before !== v && before.ctl) { before.rotate = false; before.ctl.hide(); }
  state.view = i;
  views.forEach((x) => { x.body.hidden = x !== v; });
  $$('.tab').forEach((a) => {
    const active = Number(a.dataset.view) === i;
    a.setAttribute('aria-selected', String(active));
    a.tabIndex = active ? 0 : -1;
  });
  updatePanel();
  if (v.loadStatus === 'new') { v.promise = initView(v); }
  if (v.promise) await v.promise;
  if (state.view !== i) return;
  updatePanel();
  if (v.ctl) { v.ctl.update(focusFor(v)); v.ctl.show(); }
}
// Tab keyboard controls: arrows, Home and End.
$('#tabs').addEventListener('keydown', (ev) => {
  const n = views.length;
  const k = { ArrowRight: 1, ArrowLeft: -1 }[ev.key];
  let i = state.view;
  if (k) i = (i + k + n) % n; else if (ev.key === 'Home') i = 0; else if (ev.key === 'End') i = n - 1; else return;
  ev.preventDefault();
  activateView(i);
  $('#tab-' + i).focus();
});
$('#tabs').addEventListener('click', (ev) => {
  const b = ev.target.closest('.tab');
  if (b) activateView(Number(b.dataset.view));
});
$('#bodies').addEventListener('click', (ev) => {
  const b = ev.target.closest('.btn-touch');
  if (!b) return;
  const v = views[Number(b.dataset.touch)];
  v.rotate = !v.rotate;
  applyTouch(v);
});
$('#b-flat').addEventListener('click', () => {
  const v = views[state.view];
  if (!v.ctl) return;
  const next = !v.flat;
  $('#b-flat').setAttribute('aria-pressed', String(next));
  v.ctl.setFlat(next);
});
$('#b-frame').addEventListener('click', () => { const v = views[state.view]; if (v.ctl) v.ctl.frame(450); });
// Theme changed: recolor views (graphs live; rebuild the others).
function rebuild(v) {
  if (!v.ctl) return;
  v.ctl.destroy(); v.ctl = null; v.screen.replaceChildren(); v.loadStatus = 'new'; v.promise = null;
  if (v === views[state.view]) activateView(v.i);
}
function recolor() {
  views.forEach((v) => {
    if (!v.ctl) return;
    if (v.type === 'graph') { v.ctl.update(focusFor(v)); return; }
    rebuild(v);
  });
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', recolor);
new MutationObserver(recolor).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
[reducedMotion, touch].forEach((md) => md.addEventListener('change', () => { views.forEach((v) => { v.hint.textContent = hintText(v); }); updatePanel(); }));

/* ---------- startup ---------- */
function renderAll() {
  $('#title').textContent = data.title;
  renderIntro();
  renderConcepts();
  renderIndex();
  renderGlossary();
  renderDocument();
  renderFooter();
  if (state.node != null) renderBlock();
  placeBlock();
  show();
  synchronize();
}
$$('.seg button').forEach((b) => b.addEventListener('click', () => {
  state.level = b.dataset.level;
  $$('.seg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  renderAll();
}));
$$('.seg button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.level === state.level)));
renderPanel();
// URL with node and step (?node=…&step=N): open within the step if the node belongs to it; otherwise replace the document.
if (state.node != null) {
  if (state.step != null && stepNodes(data.steps[state.step]).includes(state.node)) { mode = 'doc'; viewStep = state.step; }
  else { mode = 'outside'; state.step = null; }
}
{
  // Initial view: requested by ?view=, the step's, the one containing the open node, or the first step's.
  const requested = viewById(params.get('view'));
  const forNode = state.node != null ? views.find((x) => x.ids.includes(state.node)) : null;
  const forStep = state.step != null ? viewById(data.steps[state.step].view) : viewById(data.steps[0].view);
  state.view = (requested || (state.step != null ? forStep : null) || forNode || forStep || views[0]).i;
}
renderAll();
activateView(state.view);
if (mode === 'doc') $(`.step[data-step="${viewStep}"]`).scrollIntoView({ block: 'start' });
else if (state.step != null) $(`.step[data-step="${state.step}"]`).scrollIntoView({ block: 'start' });
})();
</script>
