      ajustarControlosPlano();
      medir();
      enquadrar(0, planoAtivo ? desenho.dirPlano : desenho.dir3D);
      observador.observe(tela);
    },
    // A moldura dá à cena o que a spec diz que ela recebe. Não a isola da página: a cena corre com os poderes dela (ver references/cena.md).
    contexto() {
      cores = coresDoTema();
      return {
        THREE, cena, camara, cores,
        elemento: (id, obj) => elemento(id, obj),
        rotulo: (t, pos) => rotulo(t, pos, { fixo: true }),
        animar,
        movimentoReduzido: semMovimento.matches,
        toque: toque.matches,
      };
    },
    // Depois de correr a cena: cada nó da vista tem de estar registado.
    conferir() {
      const faltam = vista.ids.filter((id) => !elementos.has(id));
      if (faltam.length) throw new Error(`falta registar ${faltam.length === 1 ? 'o nó' : 'os nós'} ${faltam.map((id) => '«' + semCodigo(porId.get(id).curto) + '»').join(', ')}`);
    },
  };
  tela.__moldura = api; // a prova no browser lê daqui a câmara e os elementos (como o __grafo, no grafo)
  return api;
}

/* ---------- as vistas do catálogo, desenhadas com a moldura ---------- */
const construtores = {
  camadas(m, v) {
    const { V3, THREE } = m;
    const PASSO = 4.6, PROF = 3.2;
    const maxN = Math.max(...v.camadas.map((c) => c.nos.length));
    const estreita = m.largura < 520;
    // A zona do nome da camada mede-se em pixeis (cerca de 120): num ecrã estreito pede mais unidades do mundo.
    const ZONA = estreita ? Math.min(11, (120 * (maxN * PASSO + 2)) / Math.max(m.largura - 120, 120)) : 6.6;
    const larg = ZONA + maxN * PASSO + 0.8;
    const DY = 6.2 * m.esticar(larg + 1.2, (v.camadas.length - 1) * 6.2 + 8);
    const pos = new Map();
    v.camadas.forEach((c, k) => {
      const y = -k * DY;
      const placa = new THREE.Mesh(new THREE.BoxGeometry(larg, 0.3, PROF), m.mat(css(k % 2 ? '--placa-2' : '--placa')));
      placa.position.set(0, y - 0.15, 0);
      m.adicionar(placa);
      m.rotulo(c.nome, V3(-larg / 2 + 0.5, y + 0.9, 0), { fixo: true, ancora: 'dir', forte: true, estreito: true });
      c.nos.forEach((id, j) => {
        const n = porId.get(id), e = m.escala(n);
        const x = -larg / 2 + ZONA + (j + 0.5) * PASSO;
        const hx = 1.4 * e, hy = 0.75 * e;
        const bloco = new THREE.Mesh(new THREE.BoxGeometry(2 * hx, 2 * hy, 1.1), m.mat(m.corNo(n)));
        bloco.position.set(x, y + hy, 0);
        m.elemento(id, bloco);
        const sob = (c.nos.length >= 3 || (estreita && c.nos.length >= 2)) && j % 2 === 1; // com 3 ou mais na fila (2 num ecrã estreito), os nomes alternam por cima e por baixo para não se cobrirem
        m.rotulo(n.curto, sob ? V3(x, y - 0.35, 0) : V3(x, y + 2 * hy + 0.2, 0), { id, fixo: false, ancora: sob ? 'baixo' : 'cima', medio: true });
        pos.set(id, { x, y: y + hy, hx, hy });
      });
    });
    (v.ligacoes || []).forEach((l) => {
      const a = pos.get(l.de), b = pos.get(l.para);
      if (!a || !b) return;
      const u = V3(b.x - a.x, b.y - a.y, 0).normalize();
      const saida = (p) => Math.min(p.hx / Math.max(Math.abs(u.x), 1e-6), p.hy / Math.max(Math.abs(u.y), 1e-6)) + 0.12;
      const p0 = V3(a.x, a.y, 0.75).addScaledVector(u, saida(a));
      const p1 = V3(b.x, b.y, 0.75).addScaledVector(u, -saida(b));
      if (p0.distanceTo(p1) < 0.9) return;
      const material = m.mat(m.cores.linha);
      const fim = p1.clone().addScaledVector(u, -0.6);
      const g = new THREE.Group();
      g.add(m.tracos([p0, fim], 0.07, material, perfil === 'C' && l.modo === 'assincrona'), m.ponta(fim, u, 0.25, 0.6, material));
      m.adicionar(g);
      m.aresta(material, (f) => arestaAtiva(f, l.de, l.para));
    });
    const alto = (v.camadas.length - 1) * DY + 8;
    const fundo = -(v.camadas.length - 1) * DY - 1 - m.folga(m.toque ? 64 : 26, larg + 1.2, alto);
    [-1, 1].forEach((s) => { m.estender(V3(s * (larg / 2 + 0.6), 5.4, 0)); m.estender(V3(s * (larg / 2 + 0.6), fundo, 0)); });
    m.configurar({ dir3D: V3(0.28, 0.22, 1), dirPlano: V3(0, 0, 1), padrao: 'natural' });
  },

  sequencia(m, v) {
    const { V3, THREE } = m;
    const P = v.participantes, M = v.mensagens;
    const SX = 8.6, SY = 2.4 * m.esticar((P.length - 1) * 8.6 + 12, (M.length + 1) * 2.4 + 5);
    const x = new Map(P.map((id, i) => [id, (i - (P.length - 1) / 2) * SX]));
    const H = (M.length + 1) * SY + 1.2;
    P.forEach((id) => {
      const n = porId.get(id), e = m.escala(n), px = x.get(id);
      const g = new THREE.Group();
      const cab = new THREE.Mesh(new THREE.BoxGeometry(2.8 * e, 1.1 * e, 1.1), m.mat(m.corNo(n)));
      cab.position.set(px, 0, 0);
      g.add(cab, m.cilindro(V3(px, -0.55 * e, 0), V3(px, -H, 0), 0.14, m.mat(m.cores.linha)));
      m.elemento(id, g);
      // Com 4 ou mais, os nomes alternam de altura (em 3 níveis num ecrã estreito, onde as colunas ficam muito juntas).
      const nivel = P.length > 3 ? P.indexOf(id) % (m.largura < 520 ? 3 : 2) : 0;
      m.rotulo(n.curto, V3(px, 0.55 * e, 0), { id, fixo: true, ancora: 'cima', folga: [0.25, 2.2, 4.15][nivel], forte: true, medio: true });
    });
    M.forEach((msg, k) => {
      const y = -(k + 1) * SY - 0.3;
      const xa = x.get(msg.de), xb = x.get(msg.para);
      const material = m.mat(m.cores.linha);
      const assinc = perfil === 'C' && msg.modo === 'assincrona';
      const g = new THREE.Group();
      let ponto, ancora;
      if (msg.de === msg.para) {
        const pts = [V3(xa + 0.2, y, 0.2), V3(xa + 2.2, y, 0.2), V3(xa + 2.2, y - 0.9, 0.2), V3(xa + 0.9, y - 0.9, 0.2)];
        g.add(m.tracos(pts, 0.07, material, assinc), m.ponta(pts[3], V3(-1, 0, 0), 0.25, 0.6, material));
        ponto = V3(xa + 2.5, y - 0.45, 0.2); ancora = 'dir';
      } else {
        const s = Math.sign(xb - xa);
        const p0 = V3(xa + s * 0.2, y, 0.2), fim = V3(xb - s * 0.8, y, 0.2);
        g.add(m.tracos([p0, fim], 0.07, material, assinc), m.ponta(fim, V3(s, 0, 0), 0.25, 0.6, material));
        ponto = V3((xa + xb) / 2, y + 0.12, 0.2); ancora = 'cima';
      }
      m.adicionar(g);
      m.aresta(material, (f) => f.ativos.has(msg.id) || (f.no != null && (msg.de === f.no || msg.para === f.no)));
      m.rotulo(`${k + 1}. ${msg.texto}`, ponto, { id: msg.id, fixo: false, ancora, longo: true });
    });
    const xs = [...x.values()];
    const lado = m.folga(58, Math.max(...xs) - Math.min(...xs) + 2, H + 6);
    const topo = 3.2 + m.folga(P.length > 3 ? (m.largura < 520 ? 84 : 58) : 34, Math.max(...xs) - Math.min(...xs) + 2, H + 6);
    m.estender(V3(Math.min(...xs) - lado, topo, 0)); m.estender(V3(Math.max(...xs) + lado, topo, 0));
    const base = -H - 0.6 - m.folga(m.toque ? 64 : 20, Math.max(...xs) - Math.min(...xs) + 2, H + 6);
    m.estender(V3(Math.min(...xs) - lado, base, 0)); m.estender(V3(Math.max(...xs) + lado, base, 0));
    m.configurar({ dir3D: V3(0.22, 0.12, 1), dirPlano: V3(0, 0, 1), padrao: 'natural' });
  },

  estados(m, v) {
    const { V3, THREE } = m;
    const S = v.estados;
    const R = Math.max(5.5, S.length * 1.3);
    const pos = new Map(), raio = new Map();
    S.forEach((id, i) => {
      const a = (i / S.length) * Math.PI * 2 - Math.PI / 2;
      const n = porId.get(id), e = m.escala(n), r = 0.9 * e;
      const p = V3(R * Math.cos(a), 0, R * Math.sin(a));
      pos.set(id, p); raio.set(id, r);
      const g = new THREE.Group();
      const esfera = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), m.mat(m.corNo(n)));
      esfera.position.copy(p);
      g.add(esfera);
      if (id === v.inicial) {
        const anel = new THREE.Mesh(new THREE.TorusGeometry(r + 0.4, 0.07, 8, 40), m.mat(m.corNo(n)));
        anel.rotation.x = Math.PI / 2;
        anel.position.copy(p);
        g.add(anel);
      }
      m.elemento(id, g);
      m.rotulo(id === v.inicial ? `${n.curto} (inicial)` : n.curto, p, { id, fixo: true, ancora: 'cima', folga: 1.0, forte: true });
    });
    // Os rótulos das transições não se cobrem: cada um procura, ao longo da sua curva, um ponto onde a caixa do texto (medida em unidades do mundo, pelo tamanho provável na tela) não toca nos já postos.
    const pxPorUnidade = Math.max(3, Math.min(m.largura / (2 * R + 10), (m.altura || 420) / (2 * R + 8)));
    const colocados = [];
    const livre = (p, texto) => {
      const w = (texto.length * 7.4 + 14) / pxPorUnidade, hh = 22 / pxPorUnidade;
      return colocados.every((c) => Math.abs(c.p.x - p.x) > (c.w + w) / 2 || Math.abs(c.p.z - p.z) > (c.h + hh) / 2);
    };
    const poe = (curva, texto) => {
      let escolhido = curva.getPoint(0.5);
      for (const k of [0.5, 0.36, 0.64, 0.26, 0.74]) {
        const p = curva.getPoint(k);
        if (livre(p, texto)) { escolhido = p; break; }
      }
      colocados.push({ p: escolhido, w: (texto.length * 7.4 + 14) / pxPorUnidade, h: 22 / pxPorUnidade });
      return escolhido;
    };
    v.transicoes.forEach((t) => {
      const a = pos.get(t.de), b = pos.get(t.para);
      const material = m.mat(m.cores.linha);
      const g = new THREE.Group();
      let ponto;
      if (t.de === t.para) {
        const fora = V3(a.x, 0, a.z).normalize();
        const C = a.clone().addScaledVector(fora, raio.get(t.de) + 0.55), rr = 0.75, N = 28;
        const fi = Math.atan2(a.z - C.z, a.x - C.x);
        const fimAng = fi + Math.PI * 2 - 0.45;
        const pts = [];
        for (let i = 0; i <= N; i++) {
          const th = fi + 0.45 + (i / N) * (fimAng - fi - 0.45);
          pts.push(V3(C.x + rr * Math.cos(th), 0, C.z + rr * Math.sin(th)));
        }
        g.add(m.tracos(pts, 0.07, material, false), m.ponta(pts[N], V3(-Math.sin(fimAng), 0, Math.cos(fimAng)), 0.25, 0.55, material));
        ponto = V3(C.x + fora.x * (rr + 0.9), 0, C.z + fora.z * (rr + 0.9));
        colocados.push({ p: ponto, w: (t.evento.length * 7.4 + 14) / pxPorUnidade, h: 22 / pxPorUnidade });
      } else {
        const dir = b.clone().sub(a);
        const L = dir.length();
        dir.normalize();
        const p0 = a.clone().addScaledVector(dir, raio.get(t.de) + 0.15);
        const pf = b.clone().addScaledVector(dir, -(raio.get(t.para) + 0.15));
        const perp = V3(-dir.z, 0, dir.x);
        const ctrl = p0.clone().add(pf).multiplyScalar(0.5).addScaledVector(perp, L * 0.22).add(V3(0, 0.8, 0));
        const tan = pf.clone().sub(ctrl).normalize();
        const fim = pf.clone().addScaledVector(tan, -0.6);
        const curva = new THREE.QuadraticBezierCurve3(p0, ctrl, fim);
        g.add(m.tracos(curva.getPoints(30), 0.07, material, false), m.ponta(fim, tan, 0.25, 0.6, material));
        ponto = poe(curva, t.evento);
      }
      m.adicionar(g);
      const ativa = (f) => arestaAtiva(f, t.de, t.para);
      m.aresta(material, ativa);
      m.rotulo(t.evento, ponto, { fixo: false, ancora: 'cima', folga: 0.1, longo: true, secundario: true, ativa });
    });
    m.estender(V3(-R - 5, 0, -R - 4)); m.estender(V3(R + 5, 1.5, R + 4));
    m.configurar({ dir3D: V3(0, 0.85, 0.5), dirPlano: V3(0, 1, 0.0001), padrao: 'natural' });
  },

  'linha-do-tempo'(m, v) {
    const { V3, THREE } = m;
    const E = v.eventos;
    if (m.largura < 520 && E.length >= 3) {
      // Num ecrã estreito e alto, o tempo corre de cima para baixo: a data à esquerda do eixo e o nome à direita.
      const SY = 4.2, y0 = ((E.length - 1) / 2) * SY;
      m.adicionar(m.cilindro(V3(0, y0 + 2.5, 0), V3(0, -y0 - 2.5, 0), 0.09, m.mat(m.cores.linha)));
      E.forEach((ev, i) => {
        const n = porId.get(ev.no), e = m.escala(n), y = y0 - i * SY;
        const g = new THREE.Group();
        const marca = new THREE.Mesh(new THREE.SphereGeometry(0.55 * e, 20, 14), m.mat(m.corNo(n)));
        marca.position.set(0, y, 0);
        g.add(marca);
        m.elemento(ev.no, g);
        m.rotulo(ev.quando, V3(-0.9 * e, y, 0), { id: ev.no, fixo: true, ancora: 'esq', forte: true, medio: true });
        m.rotulo(n.curto, V3(0.9 * e, y, 0), { id: ev.no, fixo: false, ancora: 'dir', medio: true });
      });
      const alto = 2 * y0 + 7;
      const lado = m.folga(130, 2, alto), cima = y0 + 3.5 + m.folga(12, 2, alto), baixo = -y0 - 3.5 - m.folga(m.toque ? 64 : 12, 2, alto);
      [-1, 1].forEach((s) => { m.estender(V3(s * lado, cima, 0)); m.estender(V3(s * lado, baixo, 0)); });
      m.configurar({ dir3D: V3(0.12, 0.1, 1), dirPlano: V3(0, 0, 1), padrao: 'natural' });
      return;
    }
    const SX = 5.6;
    const x0 = -((E.length - 1) / 2) * SX;
    m.adicionar(m.cilindro(V3(x0 - 3, 0, 0), V3(-x0 + 3, 0, 0), 0.09, m.mat(m.cores.linha)));
    E.forEach((ev, i) => {
      const n = porId.get(ev.no), e = m.escala(n), x = x0 + i * SX;
      const alto = i % 2 ? 3.0 : 1.7;
      const g = new THREE.Group();
      const marca = new THREE.Mesh(new THREE.SphereGeometry(0.55 * e, 20, 14), m.mat(m.corNo(n)));
      marca.position.set(x, 0, 0);
      g.add(marca,
        m.cilindro(V3(x, 0.5 * e, 0), V3(x, alto - 0.3, 0), 0.05, m.mat(m.cores.linha)),
        m.cilindro(V3(x, -0.5 * e, 0), V3(x, -alto + 0.3, 0), 0.05, m.mat(m.cores.linha)));
      m.elemento(ev.no, g);
      m.rotulo(ev.quando, V3(x, alto, 0), { id: ev.no, fixo: true, ancora: 'cima', forte: true });
      m.rotulo(n.curto, V3(x, -alto, 0), { id: ev.no, fixo: false, ancora: 'baixo' });
    });
    const lado = 3 + m.folga(50, -2 * x0 + 6, 12);
    [-1, 1].forEach((s) => { m.estender(V3(s * (-x0 + lado), 5, 0)); m.estender(V3(s * (-x0 + lado), -5, 0)); });
    m.configurar({ dir3D: V3(0.15, 0.12, 1), dirPlano: V3(0, 0, 1), padrao: 'natural' });
  },

  // A cena do agente: a moldura chama-a só agora, com o three já carregado, e confere o que ela registou.
  cena(m, v, cores, api) {
    try {
      if (typeof window.explainCena !== 'function') throw new Error('a página não traz o código da cena');
      const f = window.explainCena; // chamada sem this: a cena não recebe a janela
      const r = f(api.contexto());
      api.conferir();
      return r;
    } catch (e) {
      const er = new Error(String(e && e.message ? e.message : e).slice(0, 240));
      er.daCena = true;
      throw er;
    }
  },
};

/* ---------- a vista «grafo», pela biblioteca 3d-force-graph ---------- */
function criarGrafo(vista, tela) {
  const def = vista.def;
  const idsV = vista.ids;
  let G = null;
  let nos = [];
  let ligs = [];
  let rotulos = new Map();
  let valores = new Map();
  let visiveis = new Set();
  let hoverId = null;
  let interagiu = false;
  let acordado = true;        // o ciclo da biblioteca e o dos rótulos estão a correr
  let cicloAtivo = false;
  let motorParado = false;    // a simulação das forças já assentou
  let ultimaInteracao = -Infinity;
  let ultimaCamara = 0;
  let temporizador = 0;
  let ticks = 0;
  let ativa = false;
  let destruido = false;
  let foco = { ativos: null, no: null, vizinhanca: false };
  let baixo = null;
  const api = { aoEscolher: null };
  const idDe = (x) => (typeof x === 'object' ? x.id : x);
  const baseRisco = { baixo: 5, medio: 9, alto: 15 };

  function carregar() {
    nos = idsV.map((id) => ({ id, curto: porId.get(id).curto }));
    ligs = (def.ligacoes || []).map((l) => ({ source: l.de, target: l.para, modo: l.modo }));
    motorParado = false;
    G.graphData({ nodes: nos, links: ligs });
    rotulos.forEach((el) => el.remove());
    rotulos = new Map();
    nos.forEach((n) => {
      const el = h('div', { class: 'rotulo-no', 'aria-hidden': 'true', hidden: true }, h('span', null, semCodigo(n.curto)));
      tela.appendChild(el);
      rotulos.set(n.id, el);
    });
  }

  function iniciar() {
    G = new ForceGraph3D(tela, { controlType: 'orbit', rendererConfig: { antialias: true, powerPreference: 'high-performance' } });
    G.renderer().setPixelRatio(razaoDePixeis());
    api.G = G;
    tela.__grafo = G; // a prova no browser lê daqui o renderer
    G.width(tela.clientWidth || 320).height(tela.clientHeight || 320)
      .showNavInfo(false)
      .numDimensions(vista.plano ? 2 : 3)
      .nodeRelSize(4).nodeResolution(toque.matches ? 10 : 16).nodeOpacity(1)
      .nodeLabel(() => '') // os rótulos são os da página; a dica da biblioteca leva HTML e não se usa
      .linkOpacity(0.85).linkResolution(toque.matches ? 4 : 6)
      .linkDirectionalArrowLength(5).linkDirectionalArrowRelPos(1)
      .enableNodeDrag(false)
      .warmupTicks(80).cooldownTicks(150).cooldownTime(4000)
      .d3VelocityDecay(0.3)
      .onNodeHover((n) => { hoverId = n ? n.id : null; tela.style.cursor = n ? 'pointer' : ''; })
      .onEngineTick(() => { if (!interagiu && ++ticks % 10 === 0) enquadrar(null, 0); })
      .onEngineStop(() => { motorParado = true; if (!interagiu) enquadrar(null, 0); agendar(300); });
    G.d3Force('link').distance(60);
    G.d3Force('charge').strength(vista.plano ? -110 : -170);
    carregar();
    G.controls().addEventListener('start', () => { interagiu = true; });
    G.controls().addEventListener('change', () => { ultimaCamara = performance.now(); });
    ajustarControlos();
    // O desenho pára quando nada mexe; qualquer interação o retoma. O clique perde-se com o ciclo parado: retoma-se logo em pointerdown.
    ['pointerdown', 'wheel', 'touchstart', 'pointermove'].forEach((ev) => tela.addEventListener(ev, acordar, { passive: true }));
    // Um toque ou clique sem arrastar escolhe o nó mais perto (no toque, com folga para o dedo).
    tela.addEventListener('pointerdown', (e) => { baixo = { x: e.clientX, y: e.clientY, t: performance.now() }; });
    tela.addEventListener('pointercancel', () => { baixo = null; });
    tela.addEventListener('pointerup', (e) => {
      if (!baixo) return;
      const mov = Math.hypot(e.clientX - baixo.x, e.clientY - baixo.y), dur = performance.now() - baixo.t;
      baixo = null;
      if (mov > 8 || dur > 700) return;
      const id = escolherNo(e, e.pointerType === 'touch' ? 30 : 0);
      if (id) { interagiu = true; if (api.aoEscolher) api.aoEscolher(id); }
    });
    atualizar();
    const tentar = () => enquadrar(null, 0);
    requestAnimationFrame(tentar);
    setTimeout(tentar, 250);
    new ResizeObserver(() => {
      if (destruido || !tela.clientWidth || !tela.clientHeight) return;
      G.width(tela.clientWidth).height(tela.clientHeight);
      if (!interagiu) enquadrar(null, 0);
      acordar();
    }).observe(tela);
    semMovimento.addEventListener('change', () => atualizar());
    toque.addEventListener('change', () => atualizar());
  }

  /* ---- pausar o desenho quando nada mexe ---- */
  function agendar(ms) {
    if (!temporizador) temporizador = setTimeout(pausar, ms);
  }
  function pausar() {
    temporizador = 0;
    if (!G || destruido || !acordado || !motorParado) return;
    const agora = performance.now();
    const resta = Math.max(REPOUSO - (agora - ultimaInteracao), 300 - (agora - ultimaCamara));
    if (resta > 40) { agendar(resta); return; }
    posicionar();
    G.pauseAnimation();
    acordado = false;
  }
  // Retoma o desenho: numa interação, ou quando o código mexe na câmara, num realce ou na vista Plano/3D.
  function acordar() {
    if (!G || !ativa || destruido) return;
    ultimaInteracao = performance.now();
    if (!acordado) { acordado = true; G.resumeAnimation(); }
    if (!cicloAtivo) { cicloAtivo = true; requestAnimationFrame(ciclo); }
    agendar(REPOUSO);
  }

  function ajustarControlos() {
    const c = G.controls();
    if (!c) return;
    c.enableRotate = !vista.plano;
    c.mouseButtons.LEFT = vista.plano ? 2 : 0;
    c.touches.ONE = vista.plano ? 1 : 0;
  }
  // Com ponteiro de toque a vista não prende o deslocamento da página, até «Rodar e aproximar».
  function ligarControlos(on) {
    if (!G) return;
    G.controls().enabled = on;
    const t = on ? 'none' : 'auto';
    tela.style.touchAction = t;
    G.renderer().domElement.style.touchAction = t;
  }

  // As ligações assíncronas (perfil C) levam a linha tracejada: a biblioteca não traceja linhas, por isso a linha afina-se até sumir e ficam pontos parados em fila; com movimento, os pontos andam.
  const assincrona = (l) => l.modo === 'assincrona';
  function atualizar(novo) {
    if (novo) foco = novo;
    if (!G) return;
    const { ativos, no, vizinhanca } = foco;
    const cores = {};
    for (let i = 1; i <= 6; i++) cores['t-' + i] = css('--t-' + i);
    ['baixo', 'medio', 'alto'].forEach((k) => { cores['r-' + k] = css('--r-' + k); });
    const esb = css('--no-esb');
    const ligN = css('--lig'), ligR = css('--lig-real'), ligE = css('--lig-esb');
    const porRisco = (n) => perfil === 'C' && n.risco;
    const corDe = (n) => (porRisco(n) ? cores['r-' + n.risco] : cores['t-' + tipoIdx.get(n.tipo)]);
    // No perfil C o tamanho diz o risco; nos outros, diz o realce.
    const valorDe = (n) => {
      if (porRisco(n)) return n.id === no ? Math.round(baseRisco[n.risco] * 1.5) : baseRisco[n.risco];
      return n.id === no ? 16 : !ativos ? 7 : ativos.has(n.id) ? 10 : 5;
    };
    valores = new Map(idsV.map((id) => [id, valorDe(porId.get(id))]));
    const ativoLig = (l) => arestaAtiva(foco, idDe(l.source), idDe(l.target));
    const corLig = (l) => (!ativos ? ligN : ativoLig(l) ? ligR : ligE);
    const movimento = !semMovimento.matches && !toque.matches;
    G.backgroundColor(css('--painel'))
      .nodeColor((n) => (!ativos || ativos.has(n.id) ? corDe(porId.get(n.id)) : esb))
      .nodeVal((n) => valores.get(n.id))
      .linkColor(corLig)
      .linkWidth((l) => (assincrona(l) ? 0.04 : ativos && ativoLig(l) ? 1.8 : 0.7))
      .linkDirectionalArrowColor(corLig)
      .linkDirectionalParticles((l) => (assincrona(l) ? 8 : 0))
      .linkDirectionalParticleWidth(1.8)
      .linkDirectionalParticleSpeed(movimento ? 0.006 : 0)
      .linkDirectionalParticleColor(corLig);
    // Rótulos: todos com até 12 elementos; com mais, só nos realçados (e no que está sob o cursor ou aberto).
    visiveis = new Set(idsV.length <= 12 ? idsV : ativos ? ativos : []);
    dims.clear();
    rotulos.forEach((el, id) => {
      if (id === no) el.setAttribute('data-sel', ''); else el.removeAttribute('data-sel');
      if (ativos && ativos.has(id)) el.setAttribute('data-real', ''); else el.removeAttribute('data-real');
    });
    acordar();
  }

  function enquadrar(ids, ms) {
    if (!G || destruido) return;
    const dur = semMovimento.matches ? 0 : (ms ?? 0);
    const filtro = ids && ids.length ? (n) => ids.includes(n.id) : undefined;
    G.zoomToFit(dur, ids && ids.length ? 70 : 40, filtro);
    if (dur) acordar();
  }

  function mudarPlano(b) {
    if (!G) return;
    vista.plano = b;
    interagiu = false;
    G.numDimensions(b ? 2 : 3);
    G.d3Force('charge').strength(b ? -110 : -170);
    carregar();
    ajustarControlos();
    atualizar();
    if (b) G.camera().up.set(0, 1, 0);
    G.cameraPosition({ x: 0, y: 0, z: 400 }, { x: 0, y: 0, z: 0 }, 0);
    requestAnimationFrame(() => enquadrar(null, 0));
    setTimeout(() => enquadrar(null, 0), 120);
    acordar();
  }

  // Cada rótulo escolhe o primeiro sítio (por baixo, por cima, à direita, à esquerda) que não cubra outro rótulo nem outro nó.
  const dims = new Map();
  const dimDe = (el, id) => {
    let d = dims.get(id);
    if (!d) { d = { w: el.offsetWidth, h: el.offsetHeight }; dims.set(id, d); }
    return d;
  };
  const cruzam = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  const discoCruza = (d, c) => {
    const nx = Math.max(c.x, Math.min(d.x, c.x + c.w)), ny = Math.max(c.y, Math.min(d.y, c.y + c.h));
    return Math.hypot(d.x - nx, d.y - ny) < d.r + 2;
  };
  // Onde um nó está no ecrã, o seu raio em pixéis e se está à frente da câmara.
  function infoNo(n, cam, alvo, w, hh) {
    const z = typeof n.z === 'number' ? n.z : 0;
    const fx = alvo.x - cam.position.x, fy = alvo.y - cam.position.y, fz = alvo.z - cam.position.z;
    const frente = (n.x - cam.position.x) * fx + (n.y - cam.position.y) * fy + (z - cam.position.z) * fz > 0;
    const p = G.graph2ScreenCoords(n.x, n.y, z);
    const dist = Math.hypot(n.x - cam.position.x, n.y - cam.position.y, z - cam.position.z) || 1;
    const r = (Math.cbrt(valores.get(n.id) || 5) * 4 * (hh / 2)) / (0.4663 * dist);
    return { x: p.x, y: p.y, r, frente, dentro: frente && p.x > -30 && p.x < w + 30 && p.y > -30 && p.y < hh + 30 };
  }
  function escolherNo(ev, tolerancia) {
    const cam = G.camera();
    cam.updateMatrixWorld();
    const alvo = G.controls().target, r = tela.getBoundingClientRect();
    let melhor = null, d = Infinity;
    nos.forEach((n) => {
      if (typeof n.x !== 'number') return;
      const i = infoNo(n, cam, alvo, r.width, r.height);
      if (!i.frente) return;
      const dist = Math.hypot(i.x + r.left - ev.clientX, i.y + r.top - ev.clientY);
      if (dist <= Math.max(i.r + 4, tolerancia) && dist < d) { d = dist; melhor = n.id; }
    });
    return melhor;
  }
  function posicionar() {
    const cam = G.camera();
    cam.updateMatrixWorld();
    const alvo = G.controls().target;
    const w = tela.clientWidth, hh = tela.clientHeight;
    const infos = [];
    nos.forEach((n) => {
      const el = rotulos.get(n.id);
      if (!el) return;
      if (typeof n.x !== 'number') { el.hidden = true; return; }
      const i = infoNo(n, cam, alvo, w, hh);
      infos.push({ n, el, x: i.x, y: i.y, r: i.r, mostrar: i.dentro && (visiveis.has(n.id) || n.id === hoverId || n.id === foco.no) });
    });
    const discos = infos.filter((i) => i.x > -30 && i.x < w + 30 && i.y > -30 && i.y < hh + 30).map((i) => ({ x: i.x, y: i.y, r: i.r, id: i.n.id }));
    const caixas = [];
    const prioridade = (i) => (i.n.id === foco.no ? 3 : i.n.id === hoverId ? 2 : 1);
    infos.filter((i) => i.mostrar).sort((a, b) => prioridade(b) - prioridade(a)).forEach((i) => {
      if (i.el.hidden) i.el.hidden = false;
      const { w: lw, h: lh } = dimDe(i.el, i.n.id);
      const g = 6;
      const cands = [
        { x: i.x - lw / 2, y: i.y + i.r + g },
        { x: i.x - lw / 2, y: i.y - i.r - g - lh },
        { x: i.x + i.r + g, y: i.y - lh / 2 },
        { x: i.x - i.r - g - lw, y: i.y - lh / 2 },
      ].map((c) => ({ ...c, w: lw, h: lh }));
      const cabe = (c) => c.x >= 0 && c.y >= 0 && c.x + c.w <= w && c.y + c.h <= hh;
      const livre = (c) => cabe(c) && !caixas.some((b) => cruzam(c, b)) && !discos.some((d) => d.id !== i.n.id && discoCruza(d, c));
      const esc = cands.find(livre) || cands.find((c) => cabe(c) && !caixas.some((b) => cruzam(c, b))) || cands.find(cabe) || cands[0];
      caixas.push(esc);
      const t = `translate(${Math.round(esc.x)}px, ${Math.round(esc.y)}px)`;
      if (i.el.style.transform !== t) i.el.style.transform = t;
    });
    infos.filter((i) => !i.mostrar).forEach((i) => { if (!i.el.hidden) i.el.hidden = true; });
  }
  // Os rótulos acompanham o desenho: param com ele e voltam com ele.
  function ciclo() {
    if (!G || !acordado || destruido) { cicloAtivo = false; return; }
    posicionar();
    requestAnimationFrame(ciclo);
  }

  iniciar();
  Object.assign(api, {
    atualizar, acordar, enquadrar: (ms) => { interagiu = false; enquadrar(null, ms); }, mudarPlano, ligarControlos,
    mostrar() { ativa = true; G.width(tela.clientWidth || 320).height(tela.clientHeight || 320); acordar(); },
    esconder() { ativa = false; if (G) { if (temporizador) { clearTimeout(temporizador); temporizador = 0; } G.pauseAnimation(); acordado = false; } },
    destruir() { destruido = true; ativa = false; if (temporizador) clearTimeout(temporizador); if (G) { G.pauseAnimation(); if (G._destructor) G._destructor(); } },
  });
  return api;
}

/* ---------- a versão em texto de cada vista: sem WebGL, sem biblioteca ou com a cena a falhar ---------- */
function textoDaVista(vista, aviso) {
  const v = vista.def;
  const modoTxt = (md) => (perfil === 'C' && md ? ', ' + PALAVRA_MODO[md] : '');
  const nomes = (ids) => ids.map((id, j) => [j ? ', ' : '', nomeEl(id)]);
  const ligacoes = () => h('ul', null, (v.ligacoes || []).map((l) => h('li', null,
    nomeEl(l.de), ' ', h('strong', null, l.tipo + modoTxt(l.modo)), ' ', nomeEl(l.para))));
  let intro, corpo;
  if (v.tipo === 'camadas') {
    intro = 'As camadas, de cima para baixo, e as ligações entre os elementos:';
    corpo = [h('ol', null, v.camadas.map((c) => h('li', null, h('strong', null, c.nome + ': '), nomes(c.nos)))), ligacoes()];
  } else if (v.tipo === 'sequencia') {
    intro = 'As mensagens, pela ordem em que acontecem:';
    corpo = h('ol', null, v.mensagens.map((mg) => h('li', null, nomeEl(mg.de), ' → ', nomeEl(mg.para), ': ', mg.texto + modoTxt(mg.modo))));
  } else if (v.tipo === 'estados') {
    intro = 'As transições entre os estados, com o estado inicial à cabeça:';
    corpo = [h('p', { class: 'texto' }, h('strong', null, 'Inicial: '), nomeEl(v.inicial)),
      h('ul', null, v.transicoes.map((t) => h('li', null, nomeEl(t.de), ' → ', nomeEl(t.para), ': ', t.evento)))];
  } else if (v.tipo === 'linha-do-tempo') {
    intro = 'Os acontecimentos, por ordem:';
    corpo = h('ol', null, v.eventos.map((e) => h('li', null, h('strong', null, e.quando + ': '), nomeEl(e.no))));
  } else if (v.tipo === 'cena') {
    intro = 'Os elementos desta vista:';
    corpo = h('ul', null, v.nos.map((id) => h('li', null, nomeEl(id))));
  } else {
    intro = `O texto e a lista de ${LISTA.toLowerCase()} têm o mesmo conteúdo. As ligações, em texto:`;
    const ligados = new Set((v.ligacoes || []).flatMap((l) => [l.de, l.para]));
    const soltos = vista.ids.filter((id) => !ligados.has(id));
    corpo = [ligacoes(), soltos.length ? h('p', { class: 'texto' }, 'Sem ligações: ', nomes(soltos)) : null];
  }
  return h('div', { class: 'sem-vista' }, h('p', { class: 'aviso' }, aviso), h('p', { class: 'texto' }, intro), corpo);
}

/* ---------- o painel: separadores, uma vista de cada vez, toque ---------- */
const DICA = {
  grafo: 'Cada seta aponta de quem age para o que sofre a ação.',
  camadas: 'Cada seta aponta de quem age para o que sofre a ação.',
  sequencia: 'As mensagens vão de cima para baixo, pela ordem em que acontecem.',
  estados: 'Cada seta é uma transição, com o que a provoca.',
  'linha-do-tempo': 'Os acontecimentos vão do mais antigo ao mais recente, pela ordem em que aconteceram.',
};
function textoDica(v) {
  const base = DICA[v.tipo] || '';
  if (!base || perfil !== 'C' || !temAssincrona(v.def)) return base;
  const movimento = v.tipo === 'grafo' && !semMovimento.matches && !toque.matches;
  return `${base} As assíncronas vão a tracejado${movimento ? ' e levam partículas' : ''}; a lista diz sempre qual é qual.`;
}
function renderPainel() {
  const abas = $('#abas'), corpos = $('#corpos');
  const varias = vistas.length > 1;
  abas.hidden = !varias;
  $('#painel-titulo').hidden = varias;
  const painel = $('#painel-vista');
  if (varias) painel.setAttribute('role', 'tabpanel');
  vistas.forEach((v) => {
    if (varias) abas.appendChild(h('button', { type: 'button', role: 'tab', class: 'aba', id: 'aba-' + v.i, 'aria-selected': 'false', 'aria-controls': 'painel-vista', tabindex: '-1', 'data-vista': v.i }, v.def.titulo));
    v.tela = h('div', { class: 'tela', role: 'img', 'aria-label': `${v.def.titulo}: vista com ${v.ids.length} elementos; o documento tem o mesmo conteúdo em texto` });
    v.botao = h('button', { type: 'button', class: 'btn btn-toque', 'data-toque': v.i, hidden: true }, 'Rodar e aproximar');
    v.dica = h('p', { class: 'setas' }, textoDica(v));
    v.corpo = h('div', { class: 'corpo-vista', 'data-vista': v.i, hidden: true },
      v.tipo === 'cena' ? null : elLegenda(v), v.dica.textContent ? v.dica : null,
      h('div', { class: 'tela-area' }, v.tela, v.botao));
    corpos.appendChild(v.corpo);
  });
}
function escolherDaVista(id) { abrirNo(id, { origem: 'fora' }); }
function aplicarToque(v) {
  if (!v.ctl) { v.botao.hidden = true; return; }
  v.ctl.ligarControlos(!toque.matches || v.rodar);
  v.botao.textContent = v.rodar ? 'Concluir' : 'Rodar e aproximar';
  v.botao.hidden = !toque.matches || v !== vistas[estado.vista];
}
function atualizarPainel() {
  const v = vistas[estado.vista];
  const texto3 = v.carga === 'texto';
  $('#coluna-vistas').toggleAttribute('data-texto', texto3);
  $('#painel-titulo').textContent = v.def.titulo;
  $('#b-plano').setAttribute('aria-pressed', String(v.plano));
  $$('.painel-acoes button').forEach((b) => { b.hidden = !v.ctl; });
  vistas.forEach(aplicarToque);
  const painel = $('#painel-vista');
  if (vistas.length > 1) painel.setAttribute('aria-labelledby', 'aba-' + v.i);
  else painel.setAttribute('aria-labelledby', 'painel-titulo');
}
function mostrarTexto(v, aviso) {
  v.carga = 'texto';
  v.corpo.setAttribute('data-texto', '');
  $('.tela-area', v.corpo).hidden = true;
  $$('.legenda, .setas', v.corpo).forEach((e) => { e.hidden = true; });
  v.corpo.appendChild(textoDaVista(v, aviso));
}
const AVISO_3D = 'As vistas 3D não abriram neste browser.';
async function iniciarVista(v) {
  v.carga = 'a abrir';
  v.corpo.setAttribute('aria-busy', 'true');
  v.tela.replaceChildren(h('p', { class: 'estado-vista' }, 'A abrir a vista…'));
  try {
    if (semWebgl) throw new Error(AVISO_3D);
    if (v.tipo === 'grafo') {
      await carregarGrafo();
      v.tela.replaceChildren();
      v.ctl = criarGrafo(v, v.tela);
    } else {
      const L = await carregarTres();
      // O three pode chegar depois de o leitor mudar de separador: a tela escondida mede 0 e a vista desenhar-se-ia com a largura de recurso. Fica por desenhar até o separador abrir (a ativarVista volta aqui).
      if (v.corpo.hidden) { v.carga = 'nova'; v.promessa = null; return; }
      v.tela.replaceChildren();
      v.ctl = criarMoldura(v, v.tela, L, construtores[v.tipo] || construtores.cena);
      v.ctl.iniciar();
    }
    v.ctl.aoEscolher = escolherDaVista;
    if (v.ctl.m) v.ctl.m.aoEscolher = escolherDaVista;
    v.ctl.aoMudarFormato = () => refazer(v);
    v.carga = 'aberta';
  } catch (e) {
    if (v.ctl) { try { v.ctl.destruir(); } catch (e2) { /* já estava partido */ } v.ctl = null; }
    v.tela.replaceChildren();
    mostrarTexto(v, e && e.daCena ? `A cena não desenhou: ${e.message}` : AVISO_3D);
  } finally {
    v.corpo.removeAttribute('aria-busy');
  }
}
async function ativarVista(i) {
  const v = vistas[i];
  const antes = vistas[estado.vista];
  if (antes !== v && antes.ctl) { antes.rodar = false; antes.ctl.esconder(); }
  estado.vista = i;
  vistas.forEach((x) => { x.corpo.hidden = x !== v; });
  $$('.aba').forEach((a) => {
    const ativo = Number(a.dataset.vista) === i;
    a.setAttribute('aria-selected', String(ativo));
    a.tabIndex = ativo ? 0 : -1;
  });
  atualizarPainel();
  if (v.carga === 'nova') { v.promessa = iniciarVista(v); }
  if (v.promessa) await v.promessa;
  if (estado.vista !== i) return;
  atualizarPainel();
  if (v.ctl) { v.ctl.atualizar(focoDe(v)); v.ctl.mostrar(); }
}
// Teclado nos separadores: setas, Início e Fim.
$('#abas').addEventListener('keydown', (ev) => {
  const n = vistas.length;
  const k = { ArrowRight: 1, ArrowLeft: -1 }[ev.key];
  let i = estado.vista;
  if (k) i = (i + k + n) % n; else if (ev.key === 'Home') i = 0; else if (ev.key === 'End') i = n - 1; else return;
  ev.preventDefault();
  ativarVista(i);
  $('#aba-' + i).focus();
});
$('#abas').addEventListener('click', (ev) => {
  const b = ev.target.closest('.aba');
  if (b) ativarVista(Number(b.dataset.vista));
});
$('#corpos').addEventListener('click', (ev) => {
  const b = ev.target.closest('.btn-toque');
  if (!b) return;
  const v = vistas[Number(b.dataset.toque)];
  v.rodar = !v.rodar;
  aplicarToque(v);
});
$('#b-plano').addEventListener('click', () => {
  const v = vistas[estado.vista];
  if (!v.ctl) return;
  const novo = !v.plano;
  $('#b-plano').setAttribute('aria-pressed', String(novo));
  v.ctl.mudarPlano(novo);
});
$('#b-enquadrar').addEventListener('click', () => { const v = vistas[estado.vista]; if (v.ctl) v.ctl.enquadrar(450); });
// O tema mudou: as vistas recolorem-se (o grafo ao vivo; as outras, desenhadas de novo).
function refazer(v) {
  if (!v.ctl) return;
  v.ctl.destruir(); v.ctl = null; v.tela.replaceChildren(); v.carga = 'nova'; v.promessa = null;
  if (v === vistas[estado.vista]) ativarVista(v.i);
}
function recolorir() {
  vistas.forEach((v) => {
    if (!v.ctl) return;
    if (v.tipo === 'grafo') { v.ctl.atualizar(focoDe(v)); return; }
    refazer(v);
  });
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', recolorir);
new MutationObserver(recolorir).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
[semMovimento, toque].forEach((md) => md.addEventListener('change', () => { vistas.forEach((v) => { v.dica.textContent = textoDica(v); }); atualizarPainel(); }));

/* ---------- arranque ---------- */
function renderTudo() {
  $('#titulo').textContent = dados.titulo;
  renderIntro();
  renderConceitos();
  renderIndice();
  renderGlossario();
  renderDocumento();
  renderRodape();
  if (estado.no != null) renderBloco();
  colocarBloco();
  mostrar();
  sincronizar();
}
$$('.seg button').forEach((b) => b.addEventListener('click', () => {
  estado.nivel = b.dataset.nivel;
  $$('.seg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  renderTudo();
}));
$$('.seg button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.nivel === estado.nivel)));
renderPainel();
// Endereço com nó e passo (?no=…&passo=N): abre no sítio, dentro do passo, quando o nó é desse passo; senão no lugar do documento.
if (estado.no != null) {
  if (estado.passo != null && nosDoPasso(dados.passos[estado.passo]).includes(estado.no)) { modo = 'doc'; passoDaVista = estado.passo; }
  else { modo = 'fora'; estado.passo = null; }
}
{
  // A vista inicial: a pedida em ?vista=, a do passo, a que tem o nó aberto, ou a do primeiro passo.
  const pedida = vistaPorId(params.get('vista'));
  const doNo = estado.no != null ? vistas.find((x) => x.ids.includes(estado.no)) : null;
  const doPasso = estado.passo != null ? vistaPorId(dados.passos[estado.passo].vista) : vistaPorId(dados.passos[0].vista);
  estado.vista = (pedida || (estado.passo != null ? doPasso : null) || doNo || doPasso || vistas[0]).i;
}
renderTudo();
ativarVista(estado.vista);
if (modo === 'doc') $(`.passo[data-passo="${passoDaVista}"]`).scrollIntoView({ block: 'start' });
else if (estado.passo != null) $(`.passo[data-passo="${estado.passo}"]`).scrollIntoView({ block: 'start' });
})();
</script>
