<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net ; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{titulo}}</title>
<style>
:root {
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --raio-s: 4px;
  --raio: 8px;
  --raio-l: 12px;
  color-scheme: light;
  --fundo: #ffffff;
  --painel: #ffffff;
  --sombra: 0 1px 2px rgb(20 24 31 / 0.08), 0 6px 20px rgb(20 24 31 / 0.09);
  --superficie: #eceef1;
  --superficie-2: #dcdfe4;
  --tinta: #1e1f22;
  --tinta-2: #4b4e54;
  --acao: #1e1f22;
  --sobre-acao: #ffffff;
  --foco: #0a63a0;
  --lig: #6a6f78;
  --lig-esb: #c3c7cd;
  --lig-real: #1e1f22;
  --no-esb: #bdbdbd;
  --placa: #e6e9ee;
  --placa-2: #d6dae1;
  --t-1: #8f6a00;
  --t-2: #0072b2;
  --t-3: #0a7f5f;
  --t-4: #c2531b;
  --t-5: #a33f7c;
  --t-6: #5e5aa8;
  --r-baixo: #0072b2;
  --r-medio: #8f6a00;
  --r-alto: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --fundo: #15171b;
    --painel: #1d2026;
    --sombra: 0 1px 2px rgb(0 0 0 / 0.5), 0 8px 24px rgb(0 0 0 / 0.4);
    --superficie: #292d34;
    --superficie-2: #363b44;
    --tinta: #ecedf0;
    --tinta-2: #c3c7cd;
    --acao: #ecedf0;
    --sobre-acao: #15171b;
    --foco: #6ab7ee;
    --lig: #9a9ea8;
    --lig-esb: #444850;
    --lig-real: #ecedf0;
    --no-esb: #50545c;
    --placa: #272b33;
    --placa-2: #323741;
    --t-1: #e0b83a;
    --t-2: #5bb3f0;
    --t-3: #3dc9a0;
    --t-4: #f08a5a;
    --t-5: #e58bbe;
    --t-6: #a9a3ee;
    --r-baixo: #5bb3f0;
    --r-medio: #e0b83a;
    --r-alto: #ff7b6b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --fundo: #15171b;
  --painel: #1d2026;
  --sombra: 0 1px 2px rgb(0 0 0 / 0.5), 0 8px 24px rgb(0 0 0 / 0.4);
  --superficie: #292d34;
  --superficie-2: #363b44;
  --tinta: #ecedf0;
  --tinta-2: #c3c7cd;
  --acao: #ecedf0;
  --sobre-acao: #15171b;
  --foco: #6ab7ee;
  --lig: #9a9ea8;
  --lig-esb: #444850;
  --lig-real: #ecedf0;
  --no-esb: #50545c;
  --placa: #272b33;
  --placa-2: #323741;
  --t-1: #e0b83a;
  --t-2: #5bb3f0;
  --t-3: #3dc9a0;
  --t-4: #f08a5a;
  --t-5: #e58bbe;
  --t-6: #a9a3ee;
  --r-baixo: #5bb3f0;
  --r-medio: #e0b83a;
  --r-alto: #ff7b6b;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--fundo);
  color: var(--tinta);
  font-family: var(--sans);
  font-size: 1rem;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; text-align: left; }
a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; border-radius: var(--raio-s); }
code.nb { white-space: nowrap; }
code {
  font-family: var(--mono);
  font-size: 0.875em;
  background: var(--superficie);
  padding: 0.1em 0.35em;
  border-radius: var(--raio-s);
  overflow-wrap: anywhere;
}
h1 { font-size: 1.75rem; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; overflow-wrap: anywhere; }
h2 { font-size: 1.25rem; line-height: 1.25; font-weight: 700; }
h3 { font-size: 1rem; line-height: 1.3; font-weight: 700; }
.texto { max-width: 62ch; overflow-wrap: anywhere; }
.texto + .texto { margin-top: 0.75rem; }

/* ---- grelha da página: texto à esquerda, vistas fixas à direita ---- */
.pagina {
  display: grid;
  grid-template-columns: minmax(0, 34rem) minmax(0, 1fr);
  column-gap: 3rem;
  align-items: start;
  padding: 1.5rem 2rem 2rem;
  max-width: 100rem;
}
.col-texto { min-width: 0; padding-bottom: 3rem; }
.cab { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }

/* ---- controlo Simples / Técnico: tom neutro, o ativo invertido ---- */
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--superficie); border-radius: var(--raio-l); }
.seg button { min-height: 40px; padding: 0 1rem; border-radius: var(--raio); font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--acao); color: var(--sobre-acao); }

/* ---- botões: uma ação dominante, as outras tonais; nenhum delimitado por linha ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  min-height: 44px; padding: 0 1.1rem; border-radius: var(--raio);
  background: var(--superficie); color: var(--tinta); font-weight: 600;
}
.btn[aria-pressed="true"], .btn-primeiro { background: var(--acao); color: var(--sobre-acao); }
.btn-discreto { min-height: 40px; padding: 0 0.9rem; }
@media (prefers-reduced-motion: no-preference) {
  .btn, .seg button, .no, .aba { transition: background-color 120ms, color 120ms; }
}
@media (hover: hover) {
  .btn:not([aria-pressed="true"]):not(.btn-primeiro):hover { background: var(--superficie-2); }
  .seg button[aria-pressed="false"]:hover { background: var(--superficie-2); }
  .aba[aria-selected="false"]:hover { background: var(--superficie-2); }
  .no:not([aria-pressed="true"]):hover { background: var(--superficie); }
}

/* ---- caminhos e endereços: partem-se só depois de «/», nunca a meio de um nome ---- */
.caminho { font-family: var(--mono); font-size: 0.8125rem; line-height: 1.45; }
.sg { white-space: nowrap; }
.refs { color: var(--tinta-2); }

/* ---- linha de um nó: a linha inteira é o botão; o realce do passo é negrito e uma marca à esquerda ---- */
.no {
  position: relative; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 0.7rem;
  width: 100%; padding: 0.4rem 0.75rem; border-radius: var(--raio); min-height: 36px;
}
.no .caminho, .no .rotulo { order: 1; flex: 1 1 auto; min-width: 0; }
.no .rotulo { font-size: 0.9375rem; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
.no .refs-cit { order: 3; flex: 1 0 100%; font-family: var(--mono); font-size: 0.8125rem; line-height: 1.45; color: var(--tinta-2); overflow-wrap: anywhere; }
.no .risco-tag { order: 2; flex: none; margin-left: auto; font-size: 0.875rem; font-weight: 600; color: var(--tinta-2); white-space: nowrap; }
.no[data-real] .caminho { font-weight: 700; }
.no[data-real]::before { content: ""; position: absolute; left: 0; top: 0.3rem; bottom: 0.3rem; width: 3px; border-radius: 2px; background: var(--tinta); }
.no[aria-pressed="true"] { background: var(--acao); color: var(--sobre-acao); }
.no[aria-pressed="true"] .refs, .no[aria-pressed="true"] .refs-cit, .no[aria-pressed="true"] .risco-tag { color: var(--sobre-acao); }
.no[aria-pressed="true"] .caminho { font-weight: 700; }
.no[aria-pressed="true"]::before { display: none; }
.lista-nos { display: grid; gap: 2px; }
@media (pointer: coarse) { .no { min-height: 44px; } }

/* ---- índice dos nós e glossário: recolhidos depois da introdução ---- */
.indice { margin-top: 1rem; }
.indice + .indice { margin-top: 0.25rem; }
.indice summary { list-style: none; display: flex; align-items: center; column-gap: 0.6rem; min-height: 44px; padding: 0 0.75rem; border-radius: var(--raio); font-weight: 700; cursor: pointer; }
.indice summary::-webkit-details-marker { display: none; }
.indice summary::before { content: ""; width: 0.45rem; height: 0.45rem; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); margin-right: 0.15rem; }
.indice[open] summary::before { transform: rotate(45deg); }
.indice[open] summary { margin-bottom: 0.25rem; }
@media (hover: hover) { .indice summary:hover { background: var(--superficie); } }
.glossario { display: grid; gap: 0.9rem; padding: 0.25rem 0.75rem 0.5rem; }
.glossario dt { font-weight: 700; }
.glossario dd { max-width: 62ch; overflow-wrap: anywhere; }

/* ---- conceitos-chave (perfil A): blocos de tom neutro, sem moldura ---- */
.conceitos { display: grid; gap: 0.75rem; margin-top: 1.25rem; }
.conceito { padding: 0.9rem 1.1rem 1rem; background: var(--superficie); border-radius: var(--raio-l); }
.conceito .rot { font-size: 0.9375rem; font-weight: 600; color: var(--tinta-2); }
.conceito .termo { font-size: 1.0625rem; font-weight: 700; line-height: 1.3; }
.conceito .texto { margin-top: 0.35rem; }

/* ---- o documento: um passo de cada vez ---- */
.documento > h2 { margin-top: 1.75rem; font-size: 1.0625rem; overflow-wrap: anywhere; }
.passo { margin-top: 1.75rem; }
.passo-cab { display: block; width: 100%; padding: 0.4rem 0; border-radius: var(--raio); }
.passo-cab .n { display: flex; justify-content: space-between; column-gap: 1rem; font-size: 0.875rem; font-weight: 700; color: var(--tinta-2); }
.passo-cab .n .d-on { display: none; }
.passo-cab .t { display: block; font-size: 1.1875rem; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.passo-cab[aria-pressed="true"] { background: var(--acao); color: var(--sobre-acao); padding: 0.55rem 0.75rem; margin-inline: -0.75rem; width: calc(100% + 1.5rem); }
.passo-cab[aria-pressed="true"] .n { color: var(--sobre-acao); }
.passo-cab[aria-pressed="true"] .n .d-on { display: inline; }
.passo-cab[aria-pressed="true"] .n .d-off { display: none; }
@media (hover: hover) { .passo-cab[aria-pressed="false"]:hover .t { text-decoration: underline; text-underline-offset: 3px; } }
.passo .texto { margin-top: 0.6rem; }
.passo .toca { margin: 1rem 0 0.35rem; font-weight: 700; font-size: 0.9375rem; }
.passo .bloco-no { margin: 1rem 0 0.25rem; }
#miolo > .bloco-no, #bloco-no > .bloco-no { margin-top: 0.5rem; }
.cita-lista { display: grid; gap: 0.2rem; padding: 0 0.75rem; }
.rodape { margin-top: 2.25rem; font-size: 0.875rem; color: var(--tinta-2); max-width: 62ch; overflow-wrap: anywhere; }
.fontes { margin-top: 2.25rem; }
.fontes h2 { font-size: 1.0625rem; }
.fontes ul { display: grid; gap: 0.9rem; margin-top: 0.6rem; }
.fontes li { display: grid; gap: 0.1rem; max-width: 62ch; }
.fontes .fonte-titulo { font-weight: 600; overflow-wrap: anywhere; }
.fontes .refs { font-size: 0.875rem; }

/* ---- bloco de um nó: bloco elevado ---- */
.bloco-no {
  scroll-margin-top: 1rem; padding: 1.1rem 1.25rem 1.4rem;
  background: var(--painel); border-radius: var(--raio-l); box-shadow: var(--sombra);
}
.bloco-no:focus, .bloco-no:focus-visible { outline: none; }
.bloco-no .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 0.25rem 0.75rem; font-size: 0.875rem; color: var(--tinta-2); margin-bottom: 0.25rem; }
.bloco-no .meta .meta-risco { font-weight: 700; color: var(--tinta); }
.bloco-no .meta .btn { margin-left: auto; color: var(--tinta); font-size: 1rem; }
.bloco-no .meta .btn-primeiro { order: -1; margin-left: 0; margin-right: auto; color: var(--sobre-acao); }
.bloco-no .titulo-no { font-size: 1.0625rem; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
.bloco-no .titulo-no.caminho-h { font-family: var(--mono); }
.bloco-no .texto { margin-top: 0.75rem; }
.bloco-no section { margin-top: 1.5rem; }
.bloco-no section > h3 { margin-bottom: 0.4rem; }
.ficheiros-no { display: grid; gap: 0.2rem; }
.lig-item { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 0.75rem; }
.lig-item .no { flex: 1 1 0; min-width: 0; width: auto; padding-right: 0; }
.lig-item .verbo { flex: none; max-width: 45%; font-size: 0.9375rem; font-weight: 600; text-align: right; overflow-wrap: anywhere; }
.lig-item .ref { flex: 1 0 100%; font-family: var(--mono); font-size: 0.8125rem; color: var(--tinta-2); padding: 0 0.75rem 0.4rem 0.75rem; overflow-wrap: anywhere; }
.passos-do-no { display: grid; gap: 2px; }
.passos-do-no button { display: block; width: 100%; padding: 0.45rem 0.75rem; min-height: 40px; border-radius: var(--raio); }
.passos-do-no button[aria-pressed="true"] { background: var(--acao); color: var(--sobre-acao); }
@media (hover: hover) { .passos-do-no button[aria-pressed="false"]:hover { background: var(--superficie); } }

/* ---- a coluna das vistas: separadores por cima, e o painel, o único bloco elevado da página com o do nó aberto ---- */
.coluna-vistas {
  position: sticky; top: 1.5rem; height: calc(100vh - 3rem); min-height: 28rem;
  display: flex; flex-direction: column; gap: 0.6rem; min-width: 0;
}
.abas { display: flex; flex-wrap: wrap; gap: 2px; padding: 3px; align-self: flex-start; max-width: 100%; background: var(--superficie); border-radius: var(--raio-l); }
.aba { min-height: 40px; padding: 0 1rem; border-radius: var(--raio); font-weight: 600; overflow-wrap: anywhere; }
.aba[aria-selected="true"] { background: var(--acao); color: var(--sobre-acao); }
/* Ao toque, os separadores e os botões do painel têm 44 px como os nós (depois das regras base de cada um, que têm a mesma especificidade). */
@media (pointer: coarse) { .aba, .seg button, .btn-discreto { min-height: 44px; } }
.painel-vista {
  flex: 1 1 auto; min-height: 0; min-width: 0;
  display: flex; flex-direction: column; gap: 0.6rem;
  padding: 1rem 1.1rem 1.1rem; background: var(--painel); border-radius: var(--raio-l); box-shadow: var(--sombra);
}
.painel-cab { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
.painel-cab h2 { font-size: 1.0625rem; overflow-wrap: anywhere; }
.painel-acoes { display: flex; gap: 0.4rem; margin-left: auto; }
.corpos { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.corpo-vista { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 0.6rem; }
.legenda { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 1.1rem; font-size: 0.875rem; color: var(--tinta); }
.legenda li { display: inline-flex; align-items: center; gap: 0.4rem; }
.legenda .ponto { width: 0.75rem; height: 0.75rem; border-radius: 50%; background: var(--cor); }
.legenda .ponto.p1 { width: 0.5rem; height: 0.5rem; }
.legenda .ponto.p3 { width: 1rem; height: 1rem; }
.legenda .traco { width: 1.5rem; border-top: 2px dashed currentColor; }
.setas { font-size: 0.875rem; color: var(--tinta-2); max-width: 62ch; }
.tela-area { position: relative; flex: 1 1 auto; min-height: 20rem; }
.tela { position: absolute; inset: 0; overflow: hidden; }
.tela canvas { display: block; width: 100%; height: 100%; }
.capa-rotulos { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
/* A biblioteca mostra por instantes uma dica em inglês (10px) antes de o showNavInfo(false) valer. */
.tela .scene-nav-info { display: none !important; }
.estado-vista { position: absolute; inset: 0; display: grid; place-items: center; color: var(--tinta-2); font-size: 0.9375rem; }
.btn-toque { position: absolute; right: 0.5rem; bottom: 0.5rem; z-index: 3; }
.rotulo-no { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 2; }
.rotulo-no span, .rotulo-3d span {
  display: block; white-space: nowrap;
  font-size: 0.8125rem; line-height: 1.2; padding: 2px 6px; border-radius: var(--raio-s);
  color: var(--tinta);
  text-shadow: 0 0 2px var(--painel), 0 0 2px var(--painel), 0 0 4px var(--painel), 0 0 4px var(--painel);
}
.rotulo-3d span { white-space: normal; max-width: 9rem; text-align: center; overflow-wrap: anywhere; }
.rotulo-3d[data-longo] span { max-width: 13rem; }
.rotulo-3d[data-estreito] span { max-width: 5.5rem; }
.rotulo-3d[data-medio] span { max-width: 8rem; }
.rotulo-3d[data-esq] span { text-align: left; }
.rotulo-no[data-real] span, .rotulo-3d[data-real] span, .rotulo-3d[data-forte] span { font-weight: 700; }
.rotulo-no[data-sel] span, .rotulo-3d[data-sel] span { background: var(--acao); color: var(--sobre-acao); font-weight: 700; text-shadow: none; }
.sem-vista { padding: 0.5rem 0 1rem; max-width: 68ch; }
.sem-vista .aviso { font-weight: 700; font-size: 1.0625rem; }
.sem-vista .texto { margin-top: 0.25rem; }
.sem-vista ul, .sem-vista ol { display: grid; gap: 0.3rem; margin-top: 0.75rem; }
.sem-vista ol { padding-left: 1.4rem; list-style: decimal; }
.sem-vista li { font-size: 0.9375rem; line-height: 1.45; }
.sem-vista li .caminho { font-size: 0.8125rem; }
.sem-vista .rotulo-texto { font-weight: 600; }
/* Com a vista em texto, a coluna fica com a altura do que tem e rola por dentro se for maior que o ecrã. */
.coluna-vistas[data-texto] { height: auto; min-height: 0; max-height: calc(100vh - 3rem); }
.coluna-vistas[data-texto] .painel-vista { overflow: auto; }
.coluna-vistas[data-texto] .corpos, .coluna-vistas[data-texto] .corpo-vista { flex: none; }

@media (max-width: 56rem) {
  .pagina { display: block; padding: 1.25rem 1rem 2rem; }
  .col-texto { padding-bottom: 0; }
  h1 { font-size: 1.5rem; }
  .coluna-vistas, .coluna-vistas[data-texto] { position: static; height: auto; min-height: 0; max-height: none; margin-top: 2.5rem; }
  .coluna-vistas[data-texto] .painel-vista { overflow: visible; }
  .painel-vista { flex: none; }
  .corpos, .corpo-vista { flex: none; }
  .tela-area { flex: none; height: 26rem; min-height: 0; }
  .bloco-no { padding: 1rem 1rem 1.25rem; }
}
</style>
</head>
<body>
<div class="pagina">
  <main class="col-texto" id="col-texto">
    <div class="cab">
      <h1 id="titulo"></h1>
      <div class="seg" role="group" aria-label="Nível do texto">
        <button type="button" data-nivel="simples" aria-pressed="true">Simples</button>
        <button type="button" data-nivel="tecnico" aria-pressed="false">Técnico</button>
      </div>
    </div>
    <div id="intro"></div>
    <section class="conceitos" id="conceitos" aria-label="Conceitos-chave" hidden></section>
    <details class="indice" id="indice-det">
      <summary id="indice-sum"></summary>
      <ul class="lista-nos" id="indice"></ul>
    </details>
    <details class="indice" id="glossario-det" hidden>
      <summary id="glossario-sum"></summary>
      <dl class="glossario" id="glossario"></dl>
    </details>
    <div id="miolo">
      <section class="documento" id="documento" aria-labelledby="h-doc" tabindex="-1"></section>
      <div id="bloco-no" hidden></div>
    </div>
    <p class="rodape" id="rodape"></p>
  </main>
  <aside class="coluna-vistas" id="coluna-vistas" aria-label="Vistas">
    <div class="abas" id="abas" role="tablist" aria-label="Vistas" hidden></div>
    <section class="painel-vista" id="painel-vista">
      <div class="painel-cab">
        <h2 id="painel-titulo"></h2>
        <div class="painel-acoes">
          <button type="button" class="btn btn-discreto" id="b-plano" aria-pressed="false">Plano</button>
          <button type="button" class="btn btn-discreto" id="b-enquadrar">Enquadrar</button>
        </div>
      </div>
      <div class="corpos" id="corpos"></div>
    </section>
  </aside>
</div>
<script type="application/json" id="dados">{}</script>
<script id="cena-codigo"></script>
<script>
(function () {
'use strict';
/* Todo o texto dos dados entra na página por textContent ou createElement; nenhum innerHTML com dados. */

}

/* As únicas bibliotecas externas, carregadas só quando uma vista as usa: o grafo (3d-force-graph) só para a vista «grafo»; o three e os seus dois addons para todas as outras e para a cena.
   O grafo é um ficheiro só e leva a soma de verificação (SRI): o browser recusa-o se o jsDelivr o servir diferente. Os módulos do three ficam sem integrity: os +esm do jsDelivr são gerados pelo serviço e o hash não é garantido. */
const URLS = {
  grafo: 'https://cdn.jsdelivr.net/npm/3d-force-graph@1.80.1/dist/3d-force-graph.min.js',
  grafoSri: 'sha384-i98VDQKdpyVrtyuFn0fjUWJBLBmxnqHqOANcvYe9HLJUgT2wPixa4ZkLd7Dh3VEk',
  three: 'https://cdn.jsdelivr.net/npm/three@0.186.1/+esm',
  orbit: 'https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/controls/OrbitControls.js/+esm',
  css2d: 'https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/renderers/CSS2DRenderer.js/+esm',
};

/* ---------- dados e estado ---------- */
const params = new URLSearchParams(location.search);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const perfil = dados.perfil;
const gran = dados.granularidade;
const conceitos = Array.isArray(dados.conceitos) ? dados.conceitos : [];
const fontes = Array.isArray(dados.fontes) ? dados.fontes : [];
const porId = new Map(dados.nos.map((n) => [n.id, n]));
const tipoNome = Object.fromEntries(dados.tipos.map((t) => [t.id, t.nome]));
const tipoIdx = new Map(dados.tipos.map((t, i) => [t.id, i + 1]));
const N = dados.passos.length;
const semMovimento = matchMedia('(prefers-reduced-motion: reduce)');
const toque = matchMedia('(pointer: coarse)');
const NOME = { blocos: 'bloco', componentes: 'componente', detalhe: 'elemento' }[gran] || 'nó';
const LISTA = { blocos: 'Blocos', componentes: 'Componentes', detalhe: 'Detalhes' }[gran] || 'Nós';
const PALAVRA_RISCO = { baixo: 'baixo', medio: 'médio', alto: 'alto' };
const PALAVRA_MODO = { sincrona: 'síncrona', assincrona: 'assíncrona' };
const mono = dados.tema === 'codigo' && gran !== 'blocos'; // nomes de ficheiros, módulos e funções
const tema = params.get('tema');
if (tema === 'escuro') document.documentElement.setAttribute('data-theme', 'dark');
if (tema === 'claro') document.documentElement.setAttribute('data-theme', 'light');

/* ---------- o que cada vista contém ---------- */
const msgPorId = new Map();
dados.vistas.forEach((v) => { if (v.tipo === 'sequencia') v.mensagens.forEach((m) => msgPorId.set(m.id, m)); });
function nosDaVista(v) {
  switch (v.tipo) {
    case 'grafo': return v.nos && v.nos.length ? v.nos : dados.nos.map((n) => n.id);
    case 'camadas': return v.camadas.flatMap((c) => c.nos);
    case 'sequencia': return v.participantes;
    case 'estados': return v.estados;
    case 'linha-do-tempo': return [...new Set(v.eventos.map((e) => e.no))];
    default: return v.nos || [];
  }
}
// As ligações de uma vista (ligações, mensagens ou transições), para os vizinhos e para o texto.
function arestasDaVista(v) {
  if (v.tipo === 'grafo' || v.tipo === 'camadas') return (v.ligacoes || []).map((l) => ({ de: l.de, para: l.para }));
  if (v.tipo === 'sequencia') return v.mensagens.map((m) => ({ de: m.de, para: m.para, id: m.id }));
  if (v.tipo === 'estados') return v.transicoes.map((t) => ({ de: t.de, para: t.para }));
  return [];
}
function vizinhosNaVista(v, id) {
  const s = new Set();
  arestasDaVista(v).forEach((a) => {
    if (a.de === id || a.para === id) {
      s.add(a.de); s.add(a.para);
      if (a.id) s.add(a.id);
    }
  });
  s.delete(id);
  return s;
}
// O que um passo realça: os elementos da vista e, nas mensagens, quem as troca.
function idsRealcados(p) {
  const s = new Set(p.realca);
  p.realca.forEach((id) => { const m = msgPorId.get(id); if (m) { s.add(m.de); s.add(m.para); } });
  return s;
}
const nosDoPasso = (p) => [...new Set(p.realca.flatMap((id) => (porId.has(id) ? [id] : msgPorId.has(id) ? [msgPorId.get(id).de, msgPorId.get(id).para] : [])))];
const passosDoNo = (id) => dados.passos.map((p, i) => (nosDoPasso(p).includes(id) ? i : -1)).filter((i) => i >= 0);
// As relações de cada nó, vindas de todas as vistas: o que faz e o que lhe fazem.
const faz = new Map();
const sofre = new Map();
{
  const visto = new Set();
  const rel = (de, para, verbo, modo, ref) => {
    const k = `${de}\u0001${para}\u0001${verbo}`;
    if (visto.has(k)) return;
    visto.add(k);
    if (!faz.has(de)) faz.set(de, []);
    if (!sofre.has(para)) sofre.set(para, []);
    faz.get(de).push({ outro: para, verbo, modo, ref });
    sofre.get(para).push({ outro: de, verbo, modo, ref });
  };
  dados.vistas.forEach((v) => {
    if (v.tipo === 'grafo' || v.tipo === 'camadas') (v.ligacoes || []).forEach((l) => rel(l.de, l.para, l.tipo, l.modo, l.ref));
    if (v.tipo === 'sequencia') v.mensagens.forEach((m) => rel(m.de, m.para, m.texto, m.modo));
    if (v.tipo === 'estados') v.transicoes.forEach((t) => rel(t.de, t.para, t.evento));
  });
}

const vistas = dados.vistas.map((def, i) => ({
  def, i, id: def.id, tipo: def.tipo, ids: nosDaVista(def), carga: 'nova', ctl: null, corpo: null, tela: null,
  plano: params.get('plano') === '1', rodar: false,
}));
const vistaPorId = (id) => vistas.find((v) => v.id === id) || null;
const nivelUrl = params.get('nivel');
const estado = {
  nivel: nivelUrl === 'tecnico' || nivelUrl === 'simples' ? nivelUrl : (perfil === 'A' ? 'simples' : 'tecnico'),
  no: porId.has(params.get('no')) ? params.get('no') : null,
  passo: null,
  vista: 0,
};
{
  const p = parseInt(params.get('passo'), 10);
  if (p >= 1 && p <= N) estado.passo = p - 1;
}
const texto = (o) => o[estado.nivel];

/* ---------- peças de DOM ---------- */
function h(tag, attrs, ...filhos) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) if (v !== false && v != null) el.setAttribute(k, v === true ? '' : String(v));
  for (const f of filhos.flat(Infinity)) if (f != null && f !== false) el.append(f);
  return el;
}
// Só o que está entre acentos graves vira <code>; um acento grave sem par fica como texto.
function rico(s) {
  const partes = String(s).split('`');
  if (partes.length % 2 === 0) { const ultima = partes.pop(); partes[partes.length - 1] += '`' + ultima; }
  const f = document.createDocumentFragment();
  partes.forEach((p, i) => {
    if (!p) return;
    if (i % 2 === 0) f.append(p);
    else f.append(h('code', { class: p.length <= 28 ? 'nb' : null }, p));
  });
  return f;
}
const semCodigo = (s) => String(s).replaceAll('`', '');
const paragrafos = (s) => String(s).split(/\n{2,}/).map((t) => h('p', { class: 'texto' }, rico(t.trim())));
const caminhoDe = (c) => c.slice(0, c.lastIndexOf(':'));
const linhasDe = (c) => c.slice(c.lastIndexOf(':') + 1);
const ehUrl = (c) => String(c).startsWith('https:');
function ehHttps(u) { try { return new URL(u).protocol === 'https:'; } catch (e) { return false; } }

// Caminho que só se parte depois de «/»: cada pasta e o nome do ficheiro são blocos que não se dividem.
function caminhoNos(caminho, refs = []) {
  const partes = caminho.split('/');
  const nome = partes.pop();
  const saida = [];
  partes.forEach((p) => { saida.push(h('span', { class: 'sg' }, p + '/'), document.createElement('wbr')); });
  saida.push(h('span', { class: 'sg' }, nome, refs.length ? h('span', { class: 'refs' }, ':' + refs[0]) : null));
  refs.slice(1).forEach((r) => { saida.push(', ', h('span', { class: 'sg refs' }, r)); });
  return saida;
}
// O mesmo para um endereço: a parte «https:» fica agarrada ao domínio.
function urlPartes(u) {
  const m = /^(https:\/\/)(.*)$/.exec(String(u));
  const partes = (m ? m[2] : String(u)).split('/');
  if (m) partes[0] = m[1] + partes[0];
  const nome = partes.pop();
  const saida = [];
  partes.forEach((p) => { saida.push(h('span', { class: 'sg' }, p + '/'), document.createElement('wbr')); });
  saida.push(h('span', { class: 'sg' }, nome));
  return saida;
}
// A ligação só se faz com um endereço https validado; o texto entra sempre por textContent.
function ligacaoUrl(u, filhos) {
  return ehHttps(u)
    ? h('a', { class: 'caminho', href: u, target: '_blank', rel: 'noopener noreferrer' }, filhos)
    : h('span', { class: 'caminho' }, filhos);
}
function dataPt(d) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d));
  return m ? `${m[3]}/${m[2]}/${m[1]}` : String(d);
}

// Uma citação `caminho:N-M` pertence a um nó quando cai nas linhas de um dos seus `ficheiros`.
const intervalo = (c) => { const [a, b] = linhasDe(c).split('-').map(Number); return [a, b ?? a]; };
function pertence(c, n) {
  if (ehUrl(c)) return false;
  const caminho = caminhoDe(c);
  const [a, b] = intervalo(c);
  return (n.ficheiros || []).some((f) => {
    if (caminhoDe(f) !== caminho) return false;
    const [x, y] = intervalo(f);
    return a <= y && x <= b;
  });
}
const citacoesDoNo = (p, id) => (p.citacoes || []).filter((c) => pertence(c, porId.get(id)));
const citacoesSoltas = (p) => (p.citacoes || []).filter((c) => !nosDoPasso(p).some((id) => pertence(c, porId.get(id))));

// O nome de um nó: em código (caminhos, módulos, funções) ou em palavras.
function nomeDe(n) {
  return mono
    ? h('span', { class: 'caminho' }, n.curto.includes('/') ? caminhoNos(n.curto) : n.curto)
    : h('span', { class: 'rotulo' }, n.curto);
}
function etiqueta(n, cits) {
  return [nomeDe(n), cits.length && (gran !== 'blocos' || estado.nivel === 'tecnico') ? h('span', { class: 'refs-cit' }, cits.join(', ')) : null];
}
// O nome de um nó em texto corrido (as listas das vistas em texto).
function nomeEl(id) {
  const n = porId.get(id);
  return h('span', { class: mono ? 'caminho' : 'rotulo-texto' }, n.curto);
}
function elNo(id, cits = []) {
  const n = porId.get(id);
  return h('button', { type: 'button', class: 'no', 'data-no': id, 'aria-pressed': 'false' },

}
function elLigacoes(id) {
  const verbo = (l) => l.verbo + (perfil === 'C' && l.modo ? ', ' + PALAVRA_MODO[l.modo] : '');
  const linha = (l) => h('li', { class: 'lig-item' },

    s.length ? h('section', null, h('h3', null, 'O que lhe fazem'), h('ul', null, s.map(linha))) : null,

// O tipo escreve-se por extenso, e o risco também: as cores só existem junto das vistas.

// Alguma ligação ou mensagem da vista é assíncrona: a legenda e a dica só falam do tracejado quando há o que tracejar.
const temAssincrona = (def) => (def.ligacoes || def.mensagens || []).some((l) => l.modo === 'assincrona');

    return h('ul', { class: 'legenda', 'aria-label': 'Risco' }, r.map(([k, p]) => h('li', null, ponto('--r-' + k, p), 'Risco ' + PALAVRA_RISCO[k])), traco);
  }
  const usados = new Set(v.ids.map((id) => porId.get(id).tipo));
  return h('ul', { class: 'legenda', 'aria-label': 'Tipos' },
    dados.tipos.filter((t) => usados.has(t.id)).map((t) => h('li', null, ponto('--t-' + tipoIdx.get(t.id)), t.nome)));

function elFontes() {

/* ---------- o documento ---------- */
let scrollGuardado = 0;
// Onde está o bloco do nó: null (fechado), 'doc' (no sítio, dentro do passo de onde veio) ou 'fora' (no lugar do documento).

/* ---------- o que cada vista realça ---------- */
// ativos: null = nada escolhido (todos com a sua cor); senão, os ids (nós e mensagens) a realçar.
// Com passo, os elementos do passo; com um nó fora do passo, ou sem passo, o nó e os vizinhos (vizinhanca).
function focoDe(v) {
  const vazio = { ativos: null, no: null, vizinhanca: false };
  const p = estado.passo != null ? dados.passos[estado.passo] : null;
  if (p && p.vista === v.id) {
    const real = idsRealcados(p);
    if (estado.no == null || real.has(estado.no)) return { ativos: real, no: estado.no, vizinhanca: false };
  }
  if (estado.no != null && v.ids.includes(estado.no)) {
    const a = vizinhosNaVista(v.def, estado.no);
    a.add(estado.no);
    return { ativos: a, no: estado.no, vizinhanca: true };
  }
  return vazio;
}
// A aresta (ligação, transição) está ativa quando toca o nó aberto ou, num passo, quando as duas pontas estão realçadas.
const arestaAtiva = (foco, de, para) => !!foco.ativos
  && ((foco.no != null && (de === foco.no || para === foco.no)) || (!foco.vizinhanca && foco.ativos.has(de) && foco.ativos.has(para)));

/* ---------- sincronização ---------- */
function sincronizar() {
  const real = new Set(estado.passo == null ? [] : nosDoPasso(dados.passos[estado.passo]));
  $$('.no').forEach((b) => {
    const id = b.dataset.no;
    b.setAttribute('aria-pressed', String(id === estado.no));
    if (real.has(id)) b.setAttribute('data-real', ''); else b.removeAttribute('data-real');
  });
  $$('button[data-passo]').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.passo) === estado.passo)));
  vistas.forEach((v) => { if (v.ctl) v.ctl.atualizar(focoDe(v)); });
}

// Escolher o separador da vista de um passo; de um nó, a primeira vista que o tem, se a atual não o tiver.
function vistaDoPasso(i) { const v = vistaPorId(dados.passos[i].vista); if (v) ativarVista(v.i); }
function vistaDoNo(id) {
  if (vistas[estado.vista].ids.includes(id)) return;
  const v = vistas.find((x) => x.ids.includes(id));
  if (v) ativarVista(v.i);
}

// origem 'doc': veio de um passo, abre no sítio e o passo fica no ecrã. 'fora': veio do índice ou da vista, ocupa o lugar do documento (o realce do passo sai com ele).
function abrirNo(id, { origem = modo || 'fora', passoIdx = passoDaVista, foco = true } = {}) {
  if (origem === 'fora' && modo !== 'fora') scrollGuardado = window.scrollY;
  estado.no = id;
  modo = origem;
  if (modo === 'doc') { passoDaVista = passoIdx; estado.passo = passoIdx; } else { passoDaVista = null; estado.passo = null; }
  renderBloco();
  colocarBloco();
  mostrar();
  if (modo === 'doc') vistaDoPasso(passoIdx); else vistaDoNo(id);
  sincronizar();
  const v = $('.bloco-no');
  if (foco) v.focus({ preventScroll: true });
  if (modo === 'doc') {
    // O passo fica no ecrã: se o cabeçalho saiu por cima ou o fim do bloco por baixo, o cabeçalho do passo sobe ao topo.
    const c = $(`.passo-cab[data-passo="${passoDaVista}"]`).getBoundingClientRect();
    if (c.top < 0 || v.getBoundingClientRect().bottom > window.innerHeight) window.scrollTo({ top: c.top + window.scrollY - 12, behavior: 'auto' });
  } else window.scrollTo({ top: $('#bloco-no').getBoundingClientRect().top + window.scrollY - 16, behavior: 'auto' });
}
function fecharNo() {
  const antigo = estado.no, onde = passoDaVista;
  estado.no = null; modo = null;
  colocarBloco(); mostrar(); sincronizar();
  const volta = $$(`.passo[data-passo="${onde}"] .no`).find((b) => b.dataset.no === antigo);
  if (volta) volta.focus();
}
function voltar() {
  estado.no = null; modo = null;
  colocarBloco(); mostrar(); sincronizar();
  window.scrollTo({ top: scrollGuardado, behavior: 'auto' });
  $('#documento').focus({ preventScroll: true });
}
function alternarPasso(i) {
  estado.passo = estado.passo === i ? null : i;
  if (estado.passo != null) vistaDoPasso(i);
  sincronizar();
}
function irAoPasso(i) {
  estado.passo = i; estado.no = null; modo = null;
  colocarBloco(); mostrar();
  vistaDoPasso(i);
  sincronizar();
  const alvo = $(`.passo-cab[data-passo="${i}"]`);
  alvo.scrollIntoView({ block: 'start' });
  alvo.focus({ preventScroll: true });
}

document.addEventListener('click', (ev) => {
  const b = ev.target.closest('button');
  if (!b) return;
  if (b.classList.contains('no')) {
    if (b.closest('.bloco-no')) abrirNo(b.dataset.no);
    else if (b.closest('#documento')) abrirNo(b.dataset.no, { origem: 'doc', passoIdx: Number(b.closest('.passo').dataset.passo) });
    else abrirNo(b.dataset.no, { origem: 'fora' });
  } else if (b.classList.contains('passo-cab')) alternarPasso(Number(b.dataset.passo));
  else if (b.closest('.passos-do-no')) irAoPasso(Number(b.dataset.passo));
  else if (b.id === 'voltar') voltar();
  else if (b.id === 'fechar-no') fecharNo();
});

/* ---------- bibliotecas, só quando uma vista as usa ---------- */
let promessaTres = null;
let promessaGrafo = null;
function carregarTres() {
  if (!promessaTres) {

      const mapa = h('script', { type: 'importmap' });

      document.head.appendChild(mapa);

      const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
      const { CSS2DRenderer, CSS2DObject } = await import('three/addons/renderers/CSS2DRenderer.js');
      return { THREE, OrbitControls, CSS2DRenderer, CSS2DObject };

}
function carregarGrafo() {
  if (!promessaGrafo) {
    promessaGrafo = new Promise((res, rej) => {
      if (typeof ForceGraph3D === 'function') { res(); return; }
      const s = document.createElement('script');
      s.src = URLS.grafo;
      s.integrity = URLS.grafoSri;
      s.crossOrigin = 'anonymous';
      s.onload = () => res();

function webglDisponivel() {
  try {

}
const semWebgl = params.get('semwebgl') === '1' || !webglDisponivel();

/* ---------- cores do tema, lidas dos tokens ---------- */
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function coresDoTema() {
  const serie = [1, 2, 3, 4].map((i) => css('--t-' + i));
  return {
    fundo: css('--painel'), tinta: css('--tinta'), fraca: css('--tinta-2'), linha: css('--lig'), realce: css('--lig-real'), neutro: css('--no-esb'),
    serie, risco: { baixo: css('--r-baixo'), medio: css('--r-medio'), alto: css('--r-alto') },
  };
}
const corDoNo = (n) => (perfil === 'C' && n.risco ? css('--r-' + n.risco) : css('--t-' + tipoIdx.get(n.tipo)));
const ESCALA_RISCO = { baixo: 0.75, medio: 1, alto: 1.4 };
const escalaDoNo = (n) => (perfil === 'C' && n.risco ? ESCALA_RISCO[n.risco] : 1);
const REPOUSO = 2000; // pára o desenho 2 s depois da última interação
const razaoDePixeis = () => Math.min(window.devicePixelRatio || 1, 2);

/* ---------- a moldura das vistas em three.js: o ciclo, a pausa, os controlos, o realce, o clique e o Enquadrar ---------- */
function criarMoldura(vista, tela, L, construtor) {
  const { THREE, OrbitControls, CSS2DRenderer, CSS2DObject } = L;
  const def = vista.def;

  const canvas = render.domElement;
  tela.appendChild(canvas);

  tela.appendChild(rotulosR.domElement);
  const cena = new THREE.Scene();

  const sol = new THREE.DirectionalLight(new THREE.Color(1, 1, 1), 1.1);

  const camara = new THREE.PerspectiveCamera(40, 1, 0.1, 4000);
  const controlos = new OrbitControls(camara, canvas);
  controlos.enableDamping = true;
  controlos.dampingFactor = 0.12;
  controlos.screenSpacePanning = true;

  let cores = coresDoTema();
  let foco = { ativos: null, no: null, vizinhanca: false };
  let ativa = false, acordado = false, rafId = 0, temporizador = 0, ultima = 0, ultimoQuadro = 0;
  let imagens = 0, interagiu = false, apontado = null, baixo = null, tween = null, destruida = false;
  let planoAtivo = vista.plano;
  let mexeu = false;
  const elementos = new Map(); // id -> { objs: [Object3D] }
  const rotulos = [];          // { obj, el, id, fixo }
  const arestas = [];          // { mat, ativa(foco) }
  const animacoes = [];
  const extras = [];           // pontos que o Enquadrar também tem de deixar à vista (as margens dos rótulos)
  let usuario = {};            // o que a cena devolveu (aoRealcar)
  let desenho = { dir3D: V3(0.3, 0.25, 1), dirPlano: V3(0, 0, 1), padrao: 'realce' };

  /* -- ciclo com pausa: só desenha com interação ou ação da página -- */
  function desenhar() {
    render.render(cena, camara);
    rotulosR.render(cena, camara);
    imagens++;
  }
  function acordar() {
    ultima = performance.now();
    if (!ativa || destruida) return;
    if (!acordado) { acordado = true; ultimoQuadro = performance.now(); rafId = requestAnimationFrame(ciclo); }
    if (!temporizador) temporizador = setTimeout(verRepouso, REPOUSO);
  }
  function verRepouso() {
    temporizador = 0;
    const resta = REPOUSO - (performance.now() - ultima);
    if (resta > 30 && ativa) { temporizador = setTimeout(verRepouso, resta); return; }
    parar();
  }
  function parar() {
    acordado = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    if (temporizador) { clearTimeout(temporizador); temporizador = 0; }
  }
  function ciclo(t) {
    rafId = 0;
    if (!acordado || destruida) return;
    const dt = Math.min((t - ultimoQuadro) / 1000, 0.1);
    ultimoQuadro = t;
    if (tween) { passoTween(t); ultima = performance.now(); }
    if (!semMovimento.matches) {

      for (let i = animacoes.length - 1; i >= 0; i--) {

  /* -- câmara: Enquadrar pela caixa dos registados, Plano, e o movimento entre posições -- */
  function caixa() {
    const b = new THREE.Box3();
    elementos.forEach((el) => el.objs.forEach((o) => b.expandByObject(o)));
    extras.forEach((p) => b.expandByPoint(p));
    if (b.isEmpty()) b.set(V3(-1, -1, -1), V3(1, 1, 1));
    return b;
  }
  function destinoDe(dir) {
    const b = caixa();
    const centro = b.getCenter(new THREE.Vector3());
    const f = dir.clone().normalize();
    const cima = V3(0, 1, 0);
    const dir_ = new THREE.Vector3().crossVectors(cima, f);
    if (dir_.lengthSq() < 1e-8) dir_.set(1, 0, 0);
    dir_.normalize();
    const u = new THREE.Vector3().crossVectors(f, dir_).normalize();
    const tanV = Math.tan(THREE.MathUtils.degToRad(camara.fov / 2));
    const tanH = tanV * Math.max(camara.aspect, 0.2);
    let D = 0;
    for (const x of [b.min.x, b.max.x]) for (const y of [b.min.y, b.max.y]) for (const z of [b.min.z, b.max.z]) {
      const rel = V3(x, y, z).sub(centro);
      D = Math.max(D, Math.abs(rel.dot(dir_)) / tanH + rel.dot(f), Math.abs(rel.dot(u)) / tanV + rel.dot(f));
    }
    D = Math.max(D * 1.04, 4);
    // Na cena do agente os rótulos ficam ao lado dos elementos, fora da caixa que o Enquadrar mede: afasta a câmara até caberem (cerca de 70 px de cada lado).
    if (vista.tipo === 'cena' && rotulos.length) {
      const cam2 = camara.clone();
      const mx = (2 * 70) / Math.max(tela.clientWidth, 1), my = (2 * 24) / Math.max(tela.clientHeight, 1);
      for (let k = 0; k < 16; k++) {
        cam2.position.copy(centro).addScaledVector(f, D);

        cam2.updateMatrixWorld();

        if (!fora) break;

  }
  function irPara(pos, alvo, ms) {

      controlos.update();
      acordar();
      return;
    }

  }

    vista.plano = b;

  /* -- registo dos elementos, rótulos e animações (o que a cena também usa) -- */
  const donoDoMaterial = new Map();
  function elemento(id, obj) {
    if (!vista.ids.includes(id)) throw new Error(`o elemento «${id}» não é desta vista`);
    if (!obj || !obj.isObject3D) throw new Error(`o elemento «${id}» tem de ser um objeto three.js`);
    if (!obj.parent) cena.add(obj);
    obj.traverse((o) => {
      const ms = Array.isArray(o.material) ? o.material : o.material ? [o.material] : [];
      ms.forEach((mt, i) => {
        const dono = donoDoMaterial.get(mt);
        if (dono && dono !== id) { // um material partilhado por dois elementos pintaria os dois: cada um fica com o seu
          const c = mt.clone();
          if (Array.isArray(o.material)) o.material[i] = c; else o.material = c;
          donoDoMaterial.set(c, id);
        } else donoDoMaterial.set(mt, id);

    });
    if (!elementos.has(id)) elementos.set(id, { objs: [] });
    elementos.get(id).objs.push(obj);
    return obj;
  }
  const FOLGA = { cima: 'Bottom', baixo: 'Top', dir: 'Left', esq: 'Right' };
  const CENTRO = { cima: [0.5, 1], baixo: [0.5, 0], dir: [0, 0.5], esq: [1, 0.5] };
  function rotulo(textoRotulo, pos, { id = null, fixo = true, ancora = null, folga = 0, longo = false, forte = false, estreito = false, medio = false, secundario = false, ativa = null } = {}) {
    const sp = h('span', null, semCodigo(textoRotulo));
    const el = h('div', { class: 'rotulo-3d', 'data-longo': longo, 'data-forte': forte, 'data-estreito': estreito, 'data-medio': medio, 'data-esq': ancora === 'dir' }, sp);
    if (ancora && folga) sp.style['margin' + FOLGA[ancora]] = folga + 'rem';
    const o = new CSS2DObject(el);
    if (ancora && o.center) o.center.set(CENTRO[ancora][0], CENTRO[ancora][1]);
    o.position.copy(pos);

    rotulos.push({ obj: o, el, id, fixo, secundario, ativa });
    return o;
  }
  function animar(fn) { if (!semMovimento.matches && typeof fn === 'function') animacoes.push(fn); }

  /* -- as peças das vistas do catálogo -- */
  const mat = (cor) => new THREE.MeshLambertMaterial({ color: cor });
  const adicionar = (o) => { cena.add(o); return o; };
  function cilindro(a, b, r, material) {
    const d = new THREE.Vector3().subVectors(b, a);
    const comp = d.length();
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, Math.max(comp, 1e-4), 8, 1), material);
    m.position.copy(a).addScaledVector(d, 0.5);
    m.quaternion.setFromUnitVectors(V3(0, 1, 0), d.normalize());
    return m;
  }
  function ponta(base, dir, r, comp, material) {
    const c = new THREE.Mesh(new THREE.ConeGeometry(r, comp, 14), material);
    c.position.copy(base).addScaledVector(dir, comp / 2);
    c.quaternion.setFromUnitVectors(V3(0, 1, 0), dir.clone().normalize());

  // Uma linha de troços; tracejada, só os troços «ligados» de um traço de 0,55 e uma falha de 0,4.
  function tracos(pts, r, material, tracejado) {

    THREE, V3, get cores() { return cores; }, mat, adicionar, cilindro, ponta, tracos, aresta, estender, elemento, rotulo,
    corNo: (n) => new THREE.Color(corDoNo(n)), escala: escalaDoNo,
    // Quanto alongar a vertical (de 1 a 3,5) para uma vista larga e baixa encher uma tela alta, como a do telemóvel, em vez de ficar encolhida.
    esticar(largura, altura) {

    // Com «altura» (a da vista, em unidades) conta-se também o que a tela dá na vertical: manda o lado que aperta mais.
    folga(px, largura, altura = 0) {

    },
    // A largura da tela em pixeis, para as vistas se medirem pelo ecrã onde estão.
    get largura() { return tela.clientWidth || 640; },
    get altura() { return tela.clientHeight || 420; },
    get toque() { return toque.matches; },
    configurar(o) { desenho = { ...desenho, ...o }; },
  };

  /* -- o realce: elementos, arestas e rótulos -- */
  const lista = (o) => (Array.isArray(o.material) ? o.material : o.material ? [o.material] : []);
  function pintar(ativos, modoCor) {
    const real = new THREE.Color(cores.realce), neutro = new THREE.Color(cores.neutro);
    elementos.forEach((el, id) => {
      const ligado = !ativos || ativos.has(id);
      el.objs.forEach((obj) => obj.traverse((o) => lista(o).forEach((mt) => {
        if (!mt.color) return;
        if (!mt.userData.nat) mt.userData.nat = mt.color.clone();
        mt.color.copy(!ativos ? mt.userData.nat : ligado ? (modoCor === 'realce' ? real : mt.userData.nat) : neutro);
      })));
    });
  }
  function pintarArestas() {
    const normal = new THREE.Color(cores.linha), real = new THREE.Color(css('--lig-real')), esb = new THREE.Color(css('--lig-esb'));
    arestas.forEach((a) => a.mat.color.copy(!foco.ativos ? normal : a.ativa(foco) ? real : esb));
  }
  function atualizarRotulos() {
    // Todos os rótulos com até 12 elementos; com mais, só nos realçados, no aberto e no apontado. Os secundários (o acontecimento de cada transição) pedem menos num ecrã estreito.
    const limite = (sec) => (sec && tela.clientWidth < 520 ? 6 : 12);
    const conta = (sec) => rotulos.filter((r) => !r.fixo && r.secundario === sec).length;
    const todos = { false: conta(false) <= limite(false), true: conta(true) <= limite(true) };
    rotulos.forEach((r) => {
      const real = !!foco.ativos && (r.ativa ? r.ativa(foco) : r.id != null && foco.ativos.has(r.id));
      const sel = r.id != null && r.id === foco.no;
      const apt = r.id != null && r.id === apontado;
      r.obj.visible = r.fixo || todos[r.secundario] || real || sel || apt;
      r.el.toggleAttribute('data-real', real);
      r.el.toggleAttribute('data-sel', sel);

      try { usuario.aoRealcar(foco.ativos ? [...foco.ativos] : []); } catch (e) { /* o realce próprio falhou: fica o que estava */ }
    } else pintar(foco.ativos, desenho.padrao);
    pintarArestas();
    atualizarRotulos();

  /* -- clique e hover: raios contra os elementos registados; no toque, o elemento mais perto do dedo -- */
  const raio = new THREE.Raycaster();
  const ptr = new THREE.Vector2();
  function escolher(ev, tolerancia) {
    const r = canvas.getBoundingClientRect();
    ptr.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
    raio.setFromCamera(ptr, camara);
    let melhor = null, d = Infinity;
    elementos.forEach((el, id) => el.objs.forEach((o) => {
      const hit = raio.intersectObject(o, true);
      if (hit.length && hit[0].distance < d) { d = hit[0].distance; melhor = id; }
    }));
    if (melhor || !tolerancia) return melhor;
    let dpx = tolerancia;
    elementos.forEach((el, id) => el.objs.forEach((o) => {
      const c = new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3()).project(camara);
      if (c.z > 1) return;
      const dist = Math.hypot((c.x * 0.5 + 0.5) * r.width + r.left - ev.clientX, (-c.y * 0.5 + 0.5) * r.height + r.top - ev.clientY);
      if (dist < dpx) { dpx = dist; melhor = id; }
    }));
    return melhor;
  }
  canvas.addEventListener('pointerdown', (e) => { baixo = { x: e.clientX, y: e.clientY, t: performance.now() }; acordar(); });
  canvas.addEventListener('pointerup', (e) => {
    if (!baixo) return;
    const mov = Math.hypot(e.clientX - baixo.x, e.clientY - baixo.y), dur = performance.now() - baixo.t;
    baixo = null;
    if (mov > 8 || dur > 700) return;

  canvas.addEventListener('pointermove', (e) => {

    if (id !== apontado) { apontado = id; canvas.style.cursor = id ? 'pointer' : ''; atualizarRotulos(); }
  });
  canvas.addEventListener('pointerleave', () => { if (apontado) { apontado = null; canvas.style.cursor = ''; atualizarRotulos(); } });
  canvas.addEventListener('wheel', acordar, { passive: true });
  canvas.addEventListener('touchstart', acordar, { passive: true });
  controlos.addEventListener('start', () => { interagiu = true; });
  controlos.addEventListener('change', () => { mexeu = true; acordar(); });

  /* -- o deslocamento por toque: sem controlos a vista não o prende -- */
  function ligarControlos(on) {
    controlos.enabled = on;
    const t = on ? 'none' : 'auto';
    canvas.style.touchAction = t;
    tela.style.touchAction = t;
  }

  /* -- tamanho -- */
  function medir() {
    const w = tela.clientWidth, hh = tela.clientHeight;
    if (!w || !hh) return false;
    render.setSize(w, hh, false);
    rotulosR.setSize(w, hh);

  }
  // O formato (estreito, largo) conta-se com a largura que os construtores medem (m.largura, que com a tela escondida cai nos 640 de recurso): construir e o observador comparam a mesma medida.

    if (api.aoMudarFormato && estreito() !== estreitaAoDesenhar) { api.aoMudarFormato(); return; }
    if (!interagiu) enquadrar(0, planoAtivo ? desenho.dirPlano : undefined);
    acordar();
  });

  /* -- arranque: constrói, confere e enquadra -- */
  const api = {
    canvas, render, camara, controlos, cena, elementos, m,
    imagens: () => imagens,
    mexeu: () => mexeu,
    atualizar, acordar, ligarControlos,
    enquadrar: (ms) => { interagiu = false; enquadrar(ms, planoAtivo ? desenho.dirPlano : undefined); },
    mudarPlano,
    mostrar() { ativa = true; medir(); acordar(); },
    esconder() { ativa = false; parar(); },
    destruir() {
      destruida = true; ativa = false; parar(); observador.disconnect();
      cena.traverse((o) => { if (o.geometry) o.geometry.dispose(); lista(o).forEach((mt) => mt.dispose()); });
      controlos.dispose(); render.dispose(); render.forceContextLoss();
    },
    iniciar() {
      cores = coresDoTema();
